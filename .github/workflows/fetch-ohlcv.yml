name: fetch-ohlcv

# Fetches daily OHLCV from Yahoo Finance and commits updates to
# data/market/ohlcv/. The sandboxed agent reads from the committed repo,
# so this workflow is what keeps it running autonomously.
#
# Schedules:
#   - Mon-Fri 22:30 UTC — full universe (equities + ETFs + forex + crypto),
#     comfortably after the US close (20:00 UTC in EDT, 21:00 UTC in EST).
#     Running after the close is the point: the fetch captures the SAME day's
#     bar. `python scripts/fetch_ohlcv.py --dry-run` prints the symbol count —
#     it moves with index composition, so it is not restated here.
#   - Sat-Sun 19:30 UTC — crypto-only subset. Runs BEFORE the 20:00 UTC
#     weekend session so agents read fresh intraday crypto closes rather than
#     Friday's stale data. Crypto trades 24/7; everything else is closed and
#     would return no new rows anyway. That intraday bar is a PARTIAL bar —
#     the next run re-requests it and replaces it with the final close.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 19 * * 6,0"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Days of history to fetch (default 730)"
        required: false
        default: "730"
      crypto_only:
        description: "Restrict to crypto pairs (for manual weekend refresh)"
        required: false
        default: "false"

permissions:
  contents: write  # needed to commit OHLCV updates back to main

concurrency:
  group: fetch-ohlcv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch OHLCV
        env:
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '730' }}
          MANUAL_CRYPTO_ONLY: ${{ github.event.inputs.crypto_only || 'false' }}
        run: |
          # Sanitize: only accept digits. Anything else → fall back to default.
          if ! [[ "$HISTORY_DAYS" =~ ^[0-9]+$ ]]; then
            HISTORY_DAYS=730
          fi

          # Weekend schedule (Sat=6, Sun=7 in `date -u +%u`) → crypto-only.
          # Manual dispatch can also force crypto-only via the input flag.
          DAY_OF_WEEK=$(date -u +%u)
          FLAGS=(--history-days "$HISTORY_DAYS")
          if [[ "$DAY_OF_WEEK" -ge 6 ]] || [[ "$MANUAL_CRYPTO_ONLY" == "true" ]]; then
            echo "Weekend or manual crypto-only dispatch — restricting to crypto pairs."
            FLAGS+=(--crypto-only)
          fi
          python scripts/fetch_ohlcv.py "${FLAGS[@]}"

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain data/market/ohlcv/)" ]]; then
            echo "No OHLCV changes to commit."
            exit 0
          fi

          git add data/market/ohlcv/
          DATE=$(date -u +%F)
          git commit -m "[data] ${DATE} OHLCV update"
          git push
