name: fetch-ohlcv

# Fetches daily OHLCV from Yahoo Finance and commits updates to
# data/market/ohlcv/. The sandboxed agent reads from the committed repo,
# so this workflow is what keeps it running autonomously.
#
# Schedule: 06:00 UTC, every day, in two modes, plus two same-evening CLOSE
# RUNS on weekdays that are dispatched, never scheduled here. THE MODE IS
# KEYED ON WHICH CRON FIRED (`github.event.schedule`), never on the runner's
# clock:
#   - `0 6 * * 2-6`  Tue-Sat — full universe (equities + ETFs + forex +
#     crypto). Captures the PREVIOUS calendar day's closes: Tuesday's run
#     stores Monday, Saturday's run stores Friday.
#   - `0 6 * * 0,1`  Sun-Mon — crypto-only subset, for the two days no cash
#     market trades.
#   - `close_run: eu` / `close_run: us` (a workflow_dispatch input, since
#     2026-09-28) — TODAY's cash-equity closes for one bucket, asked for the
#     same evening after that bucket's markets have closed. Dispatched by the
#     Cloudflare Worker at workers/trigger-gate/ (crons 19:15 and 21:20 UTC,
#     Mon-Fri), never by a cron here: a GitHub cron has no deadline — this
#     file's 06:00 cron started 4 h 06 to 6 h 57 late on every run from
#     2026-09-17 to 09-28 — and a close run has one, the 22:00 UTC session.
#     Why the evening at all: the vendor publishes a day's close the same
#     evening and WITHDRAWS it overnight (eu-close-probe.yml, measured
#     2026-08-14..18: populated ~17:00-20:18 UTC for Europe, a null row by
#     22:23, still null at 07:22 — the US included — and restored the next
#     afternoon). The 06:00 run sat inside that withdrawal, and its late real
#     start on the restoration edge, which is where the random one-day holes
#     of 09-17 and 09-22 came from. A close run keeps the morning run's exit
#     codes and reporter, and its store-gap pass refills the morning's holes
#     the same day. tests/test_ci_guards.py pins that no cron here selects a
#     close run and that the input the Worker dispatches exists.
#
# The mode gate read `date -u +%u` until 2026-08-12 — Mon-Fri full, Sat-Sun
# crypto-only — and the crons above moved on 2026-08-12 without it. Saturday,
# the one run that carries Friday's equity closes, therefore fired the
# full-universe cron and ran crypto-only, and Monday picked those closes up
# ~66 h late. A clock test cannot express this mapping in any case: the
# calendar day a run fires on is not the day it was scheduled for, so a run
# delayed past midnight flips its own mode. tests/test_ci_guards.py pins each
# declared cron to its case arm below, in both directions.
#
# It ran at 22:30 UTC (weekdays) / 19:30 UTC (weekends) until 2026-08-12.
# 22:30 sits in the one window where America has settled and Europe has not:
# measured, Europe's official EOD bar was ABSENT at 23:24 on D and still
# absent at 01:41 on D+1, and PRESENT at 05:20 on D+1. The store therefore
# collected exactly one European trading day short every single night for
# five weeks, and every session priced European books at D-2 while pricing
# American books at D-1. 06:00 clears the only measured positive with
# margin, and clears the Monday 04:10 resweep-held-tickers run.
#
# Do not move this later than the session start minus the scheduler's typical
# lateness. GitHub's scheduler is never on time: measured across this repo's
# scheduled jobs it landed 40 min to 2 h 45 late in August 2026, and 4 h 06
# to 6 h 57 late on every fetch-ohlcv run from 2026-09-17 to 09-28. The
# session runs at 22:00 UTC (since 2026-09-28; 20:00 before), so at 06:00
# the margin is 16 h and even that tail clears. The margin is what keeps a
# lost day of freshness rare; the staleness guard is what makes it
# survivable: a run landing after the session leaves that session pricing on
# the previous close, inside the 4 calendar days `MAX_EQUITY_STALENESS_DAYS`
# allows (scripts/fetch_market_data.py), and only a store that has genuinely
# stopped advancing aborts the session. Since the close runs, the morning
# run's deadline matters less: the cash closes it used to be the sole carrier
# of arrive the evening before, and what it alone carries is crypto, FX and
# futures, whose bars complete at 00:00 UTC.
#
# NO FORMING BAR IS EVER STORED. The scheduled runs set `end` to YESTERDAY,
# not today. Asking for today costs nothing on a cash market — the day has not
# opened — but Yahoo serves a daily bar for a 24/7 instrument (crypto, FX,
# futures on Globex) the moment the UTC day opens (verified 2026-08-12: a
# same-day BTC-USD close is returned at 07:49 UTC), so at 06:00 that row
# would be about six hours old. The session publishes whatever the store
# holds and `PortfolioManager.add_snapshot` freezes it, so a partial captured
# at 06:00 would become a permanent published mark. Under the old 22:30 cron
# the same row was ~22.5 h formed — wrong more cheaply, not right. Ending at
# yesterday makes every stored bar complete, on every instrument, and the
# published crypto/FX mark a final close. A close run asks for TODAY, and
# only for a bucket whose bell has rung — complete by construction, the one
# case the rule above does not cover.
#
# Snapshot dating: at 06:00 on day D the morning run advances the store to
# D-1, and until 2026-09-28 the 20:00 session on D published a D-1-dated row
# — exactly what the 22:30 cron on D-1 produced (the 08-04 session published
# 08-03, the 08-05 session 08-04). Since the close runs land D's cash closes
# on D's evening, the 22:00 session on D publishes a D-dated row; crypto, FX
# and futures inside it are marked at D-1's completed bar, and the bundle's
# `mixed_dates` note says so.
#
# Revisions: EVERY symbol runs with a 1-day revision window, not just crypto.
# It no longer catches partial bars — there are none — it catches the vendor
# revising an already-complete one, which is real and measured. Those
# measurements were taken under the 22:30 UTC schedule and are kept as the
# calibration they are, not restated as a present-tense property of the 06:00
# one: cash equities and ETFs did not move at all (SPY and AAPL, 0 of 23
# trailing bars drifted); GC=F/PL=F/CL=F each drifted on more than half of
# their last 23 bars, up to +3.4%; FX (`=X`) drifted mildly, worst on Fridays.
# Yahoo also restates raw `close` outright for a corporate action, which is
# what the weekly resweep-held-tickers run adjudicates. A bar the vendor does
# not revise
# re-fetches identical, so no already-stored row changes value and the diff for
# that symbol stays the single appended line. The store is in canonical form
# (ascending dates, one row per date; normalised 2026-10-03 by
# scripts/normalise_store_order.py) and the writers keep it so: a date landing
# inside the series is placed by date, untouched rows keep their exact bytes.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "0 6 * * 2-6"
    - cron: "0 6 * * 0,1"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Days of history to fetch (default 730)"
        required: false
        default: "730"
      crypto_only:
        description: "Restrict to crypto pairs (for manual weekend refresh)"
        required: false
        default: "false"
      close_run:
        description: "Same-evening close pass for ONE cash-equity bucket, asking for today's bar: eu or us. Dispatched by workers/trigger-gate/; none = the scheduled modes."
        required: false
        type: choice
        options: ["none", "eu", "us"]
        default: "none"
      shadow_timeout_minutes:
        description: "Timeout of the settlement-shadow job, in minutes (default 25). Set 1 to force a timeout and confirm the night's store commit still lands."
        required: false
        default: "25"

permissions:
  actions: write  # dispatch session-integrity on the commit this run pushes
  contents: write  # needed to commit OHLCV updates back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: fetch-ohlcv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.fetch.outputs.mode }}
      end: ${{ steps.window.outputs.end }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The `end` the morning run asks for (yesterday, UTC), published as a job
      # output so a later job measures the SAME window: it starts later and, on
      # a dispatched run, can start after 00:00 UTC. A separate step because
      # the fetch step's mode must never be derived from the runner's clock.
      - name: Record the window end
        id: window
        run: echo "end=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch OHLCV
        id: fetch
        env:
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '730' }}
          MANUAL_CRYPTO_ONLY: ${{ github.event.inputs.crypto_only || 'false' }}
          CLOSE_RUN: ${{ github.event.inputs.close_run || 'none' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Sanitize: only accept digits. Anything else → fall back to default.
          if ! [[ "$HISTORY_DAYS" =~ ^[0-9]+$ ]]; then
            HISTORY_DAYS=730
          fi

          # Mode is keyed on the cron that fired, NOT on the runner's clock.
          # `github.event.schedule` is the literal cron string from the `on:`
          # block above, and is empty on workflow_dispatch. A clock test
          # (`date -u +%u`) silently disagreed with those crons for the whole
          # of 2026-08-12 — see the header — and cannot be made to agree,
          # because a run delayed past midnight would flip its own mode.
          #
          # An unrecognised value — including a cron added above and forgotten
          # here — falls back to the FULL universe. Full is a superset of
          # crypto-only, so an unmapped schedule over-fetches rather than
          # silently dropping every equity for the day.
          case "$SCHEDULE" in
            "0 6 * * 2-6") CRYPTO_ONLY=false ;;  # full universe, Tue-Sat
            "0 6 * * 0,1") CRYPTO_ONLY=true  ;;  # no cash market trades
            "")            CRYPTO_ONLY=false ;;  # workflow_dispatch
            *)
              echo "::warning::unrecognised schedule '${SCHEDULE}' — running the full universe"
              CRYPTO_ONLY=false
              ;;
          esac
          # The manual override can only ever narrow the run.
          if [[ "$MANUAL_CRYPTO_ONLY" == "true" ]]; then
            CRYPTO_ONLY=true
          fi

          # Published so the alert step can carry the mode in its title.
          # `failure-issue` keys idempotency on the title, deliberately — a job
          # failing five days running is one fact. But this workflow's two
          # modes are two facts about two datasets, and sharing one title
          # collided them: the full-universe runs that quarantined MNST, BYND
          # and JMAT.L opened issue #37, and the Sunday CRYPTO-ONLY run closed
          # it on 2026-08-16 as "Recovered" without fetching a single one of
          # those equities. Emitted AFTER the manual override, so it names the
          # run that actually happened rather than the one the cron implied.
          #
          # A close run is a third mode, reachable only by dispatch: no cron
          # here selects it (tests/test_ci_guards.py pins that); the Worker at
          # workers/trigger-gate/ does, through the `close_run` input. It
          # narrows the run to one cash-equity bucket and asks the script for
          # TODAY's bar. Combined with crypto-only it would mean two different
          # things about `end`, so that is refused rather than resolved.
          if [[ "$CLOSE_RUN" == "eu" || "$CLOSE_RUN" == "us" ]]; then
            if [[ "$CRYPTO_ONLY" == "true" ]]; then
              echo "::error::close_run=${CLOSE_RUN} cannot be combined with crypto_only"
              exit 1
            fi
            MODE="${CLOSE_RUN}-close"
          elif [[ "$CRYPTO_ONLY" == "true" ]]; then
            MODE="crypto-only"
          else
            MODE="full universe"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          # The commit subject names a close run, so `git log` tells the
          # evening passes from the morning one. The morning subject stays
          # byte-identical: tooling greps for it.
          if [[ "$MODE" == *-close ]]; then
            echo "subject_suffix= (${CLOSE_RUN} close)" >> "$GITHUB_OUTPUT"
          else
            echo "subject_suffix=" >> "$GITHUB_OUTPUT"
          fi

          FLAGS=(--history-days "$HISTORY_DAYS")
          if [[ "$MODE" == *-close ]]; then
            echo "Close run (${CLOSE_RUN}): today's closes for one bucket."
            FLAGS+=(--close-run "$CLOSE_RUN")
          elif [[ "$CRYPTO_ONLY" == "true" ]]; then
            echo "Crypto-only run (schedule='${SCHEDULE}', manual=${MANUAL_CRYPTO_ONLY})."
            FLAGS+=(--crypto-only)
          else
            echo "Full-universe run (schedule='${SCHEDULE}')."
          fi
          # Capture the exit code rather than letting `set -e` end the step, so
          # the commit gate below can distinguish the script's DELIBERATE
          # refusals (2 = a row quarantined, 3 = a vendor outage, 4 = the
          # stored series still skips a trading day after a refetch; all mean
          # "commit what arrived, then go red") from an unhandled traceback,
          # which exits 1 partway through the loop. Committing a crashed run's
          # half-written store would publish one immutable snapshot per book at
          # two different market dates. The step still fails with the real code.
          set +e
          python scripts/fetch_ohlcv.py "${FLAGS[@]}"
          rc=$?
          set -e
          case "$rc" in
            0|2|3|4) echo "committable=true"  >> "$GITHUB_OUTPUT" ;;
            *)       echo "committable=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$rc"

      - name: Resolve commit date
        id: today
        if: ${{ !cancelled() }}
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The sha the dispatch step at the end compares against: a commit only
      # counts as this run's if HEAD moved after this point.
      - name: Record HEAD before writing
        id: before
        # always(): a writer that went red after its fetch (fetch-ohlcv exit 2/3,
        # refresh-universes) still pushes, and without this the step is skipped.
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # data/market/quarantine/ travels with the store: a row the ingest
      # tripwire refused is evidence, and evidence that only exists on an
      # ephemeral runner is no evidence at all.
      #
      # Gated on the script's deliberate exits, not on success alone and not on
      # `!cancelled()`. Both of its non-zero exits mean "commit this, then go
      # red": a quarantined row IS the evidence to preserve, and a partial store
      # after a vendor outage beats no store. Under the default success-only
      # gate this step never ran on either — so the one artifact the quarantine
      # feature exists to produce was discarded with the runner every time, and
      # the failure-rate exit threw away a whole night's good rows with the bad
      # news. A bare `!cancelled()` would go too far the other way and commit a
      # half-written store after a mid-loop crash. The run still fails; the
      # data still lands.
      #
      # data/portfolios/ data/tickers.json is staged here too: `save_registry` rewrites it on
      # every run and NO workflow was staging it, so the nightly refresh was
      # discarded every night and the file has moved only by hand (three
      # commits, ever). It is currency-resolution layer 2 — a ticker newly
      # added to a universe never acquired an entry, and since the layer-3
      # heuristic now returns None for an unenumerated suffix, the agent's
      # order died at the broker with CURRENCY_UNRESOLVED.
      #
      # data/market/store_gaps.json holds the trading days the stored series
      # still skips after the script refetched them (exit 4). It is what keeps
      # this job red, and so the failure issue open, until the store holds
      # each date: without it a gap ages out of the script's lookback and the
      # next green run closes the issue as "Recovered" on a store that still
      # lacks the day (follow-up money review r6, I1).
      #
      # data/market/instrument_status.json records every symbol the ingest
      # tripwire refused as `suspended` until it is adjudicated (plan
      # 2026-10-03, Stage 1.2). A status that died with the runner would leave
      # the frozen symbol looking healthy the next night.
      - name: Commit and push updates
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' }}
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/market/ohlcv/ data/market/quarantine/ data/market/corporate_actions.jsonl data/market/store_gaps.json data/market/instrument_status.json data/portfolios/ data/tickers.json
          message: "[data] ${{ steps.today.outputs.date }} OHLCV update${{ steps.fetch.outputs.subject_suffix }}"

      # The weekend valuation refresh reads the crypto bars this run just
      # landed, so it has to run AFTER them. Its own Sat/Sun 20:00 UTC cron is
      # kept as a fallback, but since the session prices its own day
      # (2026-09-28) the Friday-dated row is the session's, and a refresh
      # valued on Saturday's store publishes nothing new: the two weekend
      # points come from the Sun-Mon crypto-only runs, and a cron cannot be
      # relied on to land after them (this file's cron ran 4-7 h late all
      # September). A failed dispatch is a warning; the crons still run.
      - name: Dispatch the weekend refresh on the crypto bars this run landed
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' && steps.fetch.outputs.mode == 'crypto-only' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-leaderboard.yml --ref main \
            || echo "::warning::could not dispatch refresh-leaderboard.yml — its Sat/Sun 20:00 UTC cron is the fallback"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          # The mode is part of the cause. Without it a crypto-only success
          # closes a full-universe failure — see the `mode` output above.
          # The fallback matters because `if: always()` fires this step even
          # when the fetch step never ran, where the output is the empty
          # string and the title would otherwise end in an unnamed "()".
          title: "fetch-ohlcv: the price store was not updated (${{ steps.fetch.outputs.mode || 'mode unresolved' }})"
          body: |
            A scheduled `fetch-ohlcv` run failed. The trading session has no
            outbound HTTP: it prices entirely from the committed store, so a
            store that stops advancing is not a visible outage — the next
            session simply values every book against older closes.

            **Where to look**
            - Yahoo rejecting or throttling the request (the run log prints a
              per-symbol failure count).
            - A vendor-wide hole: the log says `vendor-wide hole` and names the
              date most symbols came back without a close. Re-run with
              `--resweep` over a longer window before the 22:00 session.
            - A store gap: the log says `store gap` and names the trading days
              the stored series still skips after the run refetched them over
              a wide window. They are held in `data/market/store_gaps.json`,
              and this issue stays open until the store holds each one. A date
              that cannot be filled insert-only is accepted by a human:
              `scripts/fetch_ohlcv.py --accept-gap SYMBOL:DATE --reason "..."`.
            - A push that lost a race with another scheduled writer.
            - `scripts/fetch_ohlcv.py --dry-run` locally to confirm symbol
              resolution still works.

      # A GITHUB_TOKEN push starts no `on: push` run, so session-integrity
      # would never see this run's commit. After the reporter on purpose: see
      # .github/actions/dispatch-session-integrity.
      - name: Dispatch session-integrity on the commit this run pushed
        if: always()
        uses: ./.github/actions/dispatch-session-integrity
        with:
          before: ${{ steps.before.outputs.sha }}

  # Settlement-window SHADOW (Stage 2.2 of the market-data structural plan).
  # Measures what a rolling 10-weekday refetch WOULD insert, revise or
  # quarantine, so the switch to it (2.3) is decided on ten nights of evidence.
  # It is a separate job, and never a step of `fetch`, for one reason: a job
  # cancelled at its timeout commits nothing, and `fetch` already holds a
  # ~13 minute run inside 30. A shadow that overran inside that job would have
  # thrown the night's store away. Here a hang, a timeout or a crash costs
  # only this job.
  #
  # - needs `fetch` + `if: always()`: it runs after the real fetch has
  #   committed, or has failed; `fetch`'s outcome is not its business.
  # - checks out `github.sha`, the main this run STARTED from, i.e. the store
  #   BEFORE tonight's fetch and gap-heal landed. Against the post-fetch store
  #   it could only ever report "nothing to do" and the comparison with the
  #   real fetch (scripts/compare_settlement_shadow.py) would be vacuous.
  # - full-universe runs only: a crypto-only or close run is a different
  #   population and would poison the ten-night sample. The gate's literal is
  #   the MODE the fetch step assigns; tests/test_ci_guards.py ties the two, so
  #   renaming the mode cannot silently stop the shadow. A manual full-universe
  #   dispatch also runs it; its report records `event`, so a second same-date
  #   sample is identifiable and discountable.
  # - `shadow_timeout_minutes` (dispatch input, default 25) is the falsifying
  #   control for the isolation: dispatch with 1 and the night's `[data]`
  #   commit must still land on main.
  # - `continue-on-error`: the shadow has no consumer but the artifact, and
  #   its absence is the signal. It must not turn the run red or open a
  #   failure issue for a measurement. A night that served nothing (exit 2)
  #   still uploads a report, so absence is not the whole signal: the
  #   comparison script refuses a served=0 report, and the ten-night sample
  #   counts only reports it accepted.
  # - read-only: contents: read, and the script writes under
  #   data/market/settlement_shadow/ (gitignored) and nowhere else.
  settlement-shadow:
    needs: fetch
    if: ${{ always() && needs.fetch.outputs.mode == 'full universe' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.shadow_timeout_minutes || '25') }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout the store this run started from
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the settlement shadow
        env:
          FETCH_END: ${{ needs.fetch.outputs.end }}
        run: |
          # The fetch job's own `end`; empty only if that step died before
          # publishing it, in which case the script's default (yesterday) stands.
          ARGS=()
          if [[ -n "$FETCH_END" ]]; then
            ARGS+=(--shadow-end "$FETCH_END")
          fi
          python scripts/fetch_ohlcv.py --settlement-shadow "${ARGS[@]}"

      - name: Upload the shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settlement-shadow-${{ github.run_id }}
          path: data/market/settlement_shadow/
          retention-days: 30
          if-no-files-found: warn
