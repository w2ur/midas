name: fetch-ohlcv

# Fetches daily OHLCV from Yahoo Finance and commits updates to
# data/market/ohlcv/. The sandboxed agent reads from the committed repo,
# so this workflow is what keeps it running autonomously.
#
# Schedule: 06:00 UTC, every day, in two modes. THE MODE IS KEYED ON WHICH
# CRON FIRED (`github.event.schedule`), never on the runner's clock:
#   - `0 6 * * 2-6`  Tue-Sat — full universe (equities + ETFs + forex +
#     crypto). Captures the PREVIOUS calendar day's closes: Tuesday's run
#     stores Monday, Saturday's run stores Friday.
#   - `0 6 * * 0,1`  Sun-Mon — crypto-only subset, for the two days no cash
#     market trades.
#
# The mode gate read `date -u +%u` until 2026-08-12 — Mon-Fri full, Sat-Sun
# crypto-only — and the crons above moved on 2026-08-12 without it. Saturday,
# the one run that carries Friday's equity closes, therefore fired the
# full-universe cron and ran crypto-only, and Monday picked those closes up
# ~66 h late. A clock test cannot express this mapping in any case: the
# calendar day a run fires on is not the day it was scheduled for, so a run
# delayed past midnight flips its own mode. tests/test_ci_guards.py pins each
# declared cron to its case arm below, in both directions.
#
# It ran at 22:30 UTC (weekdays) / 19:30 UTC (weekends) until 2026-08-12.
# 22:30 sits in the one window where America has settled and Europe has not:
# measured, Europe's official EOD bar was ABSENT at 23:24 on D and still
# absent at 01:41 on D+1, and PRESENT at 05:20 on D+1. The store therefore
# collected exactly one European trading day short every single night for
# five weeks, and every session priced European books at D-2 while pricing
# American books at D-1. 06:00 clears the only measured positive with
# margin, and clears the Monday 04:10 resweep-held-tickers run.
#
# Do not move this later than the session start minus the scheduler's typical
# lateness. GitHub's scheduler is never on time: measured across this repo's
# scheduled jobs it typically lands 40 min to 2 h 45 late, with a tail past
# 5 h. The session runs at 20:00 UTC today and moves to 11:00 UTC; at 06:00
# the margin is 5 h even after that move, and 14 h until then — so the
# typical case clears and the tail does not. The tail is deliberately NOT
# covered by the margin: a run landing after the session simply leaves that
# session pricing on the previous close, which is inside the 4 calendar days
# `MAX_EQUITY_STALENESS_DAYS` allows (scripts/fetch_market_data.py), and only
# a store that has genuinely stopped advancing aborts the session. The margin
# is what keeps a lost day of freshness rare; the staleness guard is what
# makes it survivable.
#
# 24/7 instruments now mark on a ~6-hour-formed bar. Yahoo serves a daily bar
# for crypto and FX as soon as the UTC day opens (verified 2026-08-12: a
# same-day BTC-USD close is returned at 07:49 UTC), so a 06:00 run writes the
# current day's row for them six hours into its formation. The 20:00 session
# publishes that row and `PortfolioManager.add_snapshot` then freezes it, so
# the next morning's revision arrives too late to move the published mark.
# Under 22:30 the same bar was ~22.5 h formed. This wants revisiting when the
# session moves to 11:00 UTC; the likely resolution is to stop writing a
# forming bar at all rather than to keep timing around one.
#
# Partial bars: EVERY symbol runs with a 1-day revision window, not just
# crypto. The finality measurements below were taken under the 22:30 UTC
# schedule and are kept as the calibration they are, not restated as a
# present-tense property of the 06:00 one: only cash equities and ETFs were
# genuinely final at 22:30 (SPY and AAPL, 0 of 23 trailing bars drifted);
# commodity futures (`=F`) were mid-Globex — the next session had already
# opened, and GC=F/PL=F/CL=F each drifted on more than half of their last 23
# bars, up to +3.4%; FX (`=X`) rolls at 17:00 ET and drifted mildly, worst on
# Fridays. At 06:00 the cash-equity bar a run is after is the PREVIOUS day's
# and is final; what forms under it now is the 24/7 row described above.
# Expect a same-day row to change value on the following run — that is the
# mechanism working. A bar that WAS final
# re-fetches identical, so no already-stored row changes value and the diff for
# that symbol stays the single appended line. merge_rows preserves the store's
# existing line order and never re-sorts it: 529 of the 1,046 files are not in
# date order, and re-sorting them from a cron would emit a ~230 MB reorder
# commit. Canonicalising the store is a separate, deliberate decision.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "0 6 * * 2-6"
    - cron: "0 6 * * 0,1"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Days of history to fetch (default 730)"
        required: false
        default: "730"
      crypto_only:
        description: "Restrict to crypto pairs (for manual weekend refresh)"
        required: false
        default: "false"

permissions:
  contents: write  # needed to commit OHLCV updates back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: fetch-ohlcv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch OHLCV
        id: fetch
        env:
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '730' }}
          MANUAL_CRYPTO_ONLY: ${{ github.event.inputs.crypto_only || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Sanitize: only accept digits. Anything else → fall back to default.
          if ! [[ "$HISTORY_DAYS" =~ ^[0-9]+$ ]]; then
            HISTORY_DAYS=730
          fi

          # Mode is keyed on the cron that fired, NOT on the runner's clock.
          # `github.event.schedule` is the literal cron string from the `on:`
          # block above, and is empty on workflow_dispatch. A clock test
          # (`date -u +%u`) silently disagreed with those crons for the whole
          # of 2026-08-12 — see the header — and cannot be made to agree,
          # because a run delayed past midnight would flip its own mode.
          #
          # An unrecognised value — including a cron added above and forgotten
          # here — falls back to the FULL universe. Full is a superset of
          # crypto-only, so an unmapped schedule over-fetches rather than
          # silently dropping every equity for the day.
          case "$SCHEDULE" in
            "0 6 * * 2-6") CRYPTO_ONLY=false ;;  # full universe, Tue-Sat
            "0 6 * * 0,1") CRYPTO_ONLY=true  ;;  # no cash market trades
            "")            CRYPTO_ONLY=false ;;  # workflow_dispatch
            *)
              echo "::warning::unrecognised schedule '${SCHEDULE}' — running the full universe"
              CRYPTO_ONLY=false
              ;;
          esac
          # The manual override can only ever narrow the run.
          if [[ "$MANUAL_CRYPTO_ONLY" == "true" ]]; then
            CRYPTO_ONLY=true
          fi

          FLAGS=(--history-days "$HISTORY_DAYS")
          if [[ "$CRYPTO_ONLY" == "true" ]]; then
            echo "Crypto-only run (schedule='${SCHEDULE}', manual=${MANUAL_CRYPTO_ONLY})."
            FLAGS+=(--crypto-only)
          else
            echo "Full-universe run (schedule='${SCHEDULE}')."
          fi
          # Capture the exit code rather than letting `set -e` end the step, so
          # the commit gate below can distinguish the script's DELIBERATE
          # refusals (2 = a row quarantined, 3 = a vendor outage; both mean
          # "commit what arrived, then go red") from an unhandled traceback,
          # which exits 1 partway through the loop. Committing a crashed run's
          # half-written store would publish one immutable snapshot per book at
          # two different market dates. The step still fails with the real code.
          set +e
          python scripts/fetch_ohlcv.py "${FLAGS[@]}"
          rc=$?
          set -e
          case "$rc" in
            0|2|3) echo "committable=true"  >> "$GITHUB_OUTPUT" ;;
            *)     echo "committable=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$rc"

      - name: Resolve commit date
        id: today
        if: ${{ !cancelled() }}
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # data/market/quarantine/ travels with the store: a row the ingest
      # tripwire refused is evidence, and evidence that only exists on an
      # ephemeral runner is no evidence at all.
      #
      # Gated on the script's deliberate exits, not on success alone and not on
      # `!cancelled()`. Both of its non-zero exits mean "commit this, then go
      # red": a quarantined row IS the evidence to preserve, and a partial store
      # after a vendor outage beats no store. Under the default success-only
      # gate this step never ran on either — so the one artifact the quarantine
      # feature exists to produce was discarded with the runner every time, and
      # the failure-rate exit threw away a whole night's good rows with the bad
      # news. A bare `!cancelled()` would go too far the other way and commit a
      # half-written store after a mid-loop crash. The run still fails; the
      # data still lands.
      #
      # data/tickers.json is staged here too: `save_registry` rewrites it on
      # every run and NO workflow was staging it, so the nightly refresh was
      # discarded every night and the file has moved only by hand (three
      # commits, ever). It is currency-resolution layer 2 — a ticker newly
      # added to a universe never acquired an entry, and since the layer-3
      # heuristic now returns None for an unenumerated suffix, the agent's
      # order died at the broker with CURRENCY_UNRESOLVED.
      - name: Commit and push updates
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' }}
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/market/ohlcv/ data/market/quarantine/ data/tickers.json
          message: "[data] ${{ steps.today.outputs.date }} OHLCV update"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "fetch-ohlcv: the price store was not updated"
          body: |
            A scheduled `fetch-ohlcv` run failed. The trading session has no
            outbound HTTP: it prices entirely from the committed store, so a
            store that stops advancing is not a visible outage — the next
            session simply values every book against older closes.

            **Where to look**
            - Yahoo rejecting or throttling the request (the run log prints a
              per-symbol failure count).
            - A push that lost a race with another scheduled writer.
            - `scripts/fetch_ohlcv.py --dry-run` locally to confirm symbol
              resolution still works.
