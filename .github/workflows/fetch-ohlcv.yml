name: fetch-ohlcv

# Fetches daily OHLCV from Yahoo Finance and commits updates to
# data/market/ohlcv/. The sandboxed agent reads from the committed repo,
# so this workflow is what keeps it running autonomously.
#
# Schedule: 06:00 UTC, every day.
#   - Tue-Sat 06:00 UTC — full universe (equities + ETFs + forex + crypto).
#     Captures the PREVIOUS calendar day's closes: Tuesday's run stores
#     Monday, Saturday's run stores Friday.
#   - Sun-Mon 06:00 UTC — crypto-only subset, for the two days no cash
#     market trades.
#
# It ran at 22:30 UTC (weekdays) / 19:30 UTC (weekends) until 2026-08-12.
# 22:30 sits in the one window where America has settled and Europe has not:
# measured, Europe's official EOD bar was ABSENT at 23:24 on D and still
# absent at 01:41 on D+1, and PRESENT at 05:20 on D+1. The store therefore
# collected exactly one European trading day short every single night for
# five weeks, and every session priced European books at D-2 while pricing
# American books at D-1. 06:00 clears the only measured positive with
# margin, and clears the Monday 04:10 resweep-held-tickers run.
#
# Do not move this later than the session start minus the observed GitHub
# scheduler lateness (37 min to 3 h). The session runs at 20:00 UTC today
# and moves to 11:00 UTC; at 06:00 this margin is 5 h even after the move,
# and 14 h until then.
#
# Partial bars: EVERY symbol runs with a 1-day revision window, not just
# crypto. Only cash equities and ETFs are genuinely final at 22:30 UTC
# (measured: SPY and AAPL, 0 of 23 trailing bars drifted). Commodity futures
# (`=F`) are mid-Globex — the next session has already opened, and GC=F/PL=F/
# CL=F each drifted on more than half of their last 23 bars, up to +3.4%.
# FX (`=X`) rolls at 17:00 ET
# and drifts mildly, worst on Fridays. Expect a same-day row to change value on
# the following run — that is the mechanism working. A bar that WAS final
# re-fetches identical, so no already-stored row changes value and the diff for
# that symbol stays the single appended line. merge_rows preserves the store's
# existing line order and never re-sorts it: 529 of the 1,046 files are not in
# date order, and re-sorting them from a cron would emit a ~230 MB reorder
# commit. Canonicalising the store is a separate, deliberate decision.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "0 6 * * 2-6"
    - cron: "0 6 * * 0,1"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Days of history to fetch (default 730)"
        required: false
        default: "730"
      crypto_only:
        description: "Restrict to crypto pairs (for manual weekend refresh)"
        required: false
        default: "false"

permissions:
  contents: write  # needed to commit OHLCV updates back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: fetch-ohlcv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch OHLCV
        id: fetch
        env:
          HISTORY_DAYS: ${{ github.event.inputs.history_days || '730' }}
          MANUAL_CRYPTO_ONLY: ${{ github.event.inputs.crypto_only || 'false' }}
        run: |
          # Sanitize: only accept digits. Anything else → fall back to default.
          if ! [[ "$HISTORY_DAYS" =~ ^[0-9]+$ ]]; then
            HISTORY_DAYS=730
          fi

          # Weekend schedule (Sat=6, Sun=7 in `date -u +%u`) → crypto-only.
          # Manual dispatch can also force crypto-only via the input flag.
          DAY_OF_WEEK=$(date -u +%u)
          FLAGS=(--history-days "$HISTORY_DAYS")
          if [[ "$DAY_OF_WEEK" -ge 6 ]] || [[ "$MANUAL_CRYPTO_ONLY" == "true" ]]; then
            echo "Weekend or manual crypto-only dispatch — restricting to crypto pairs."
            FLAGS+=(--crypto-only)
          fi
          # Capture the exit code rather than letting `set -e` end the step, so
          # the commit gate below can distinguish the script's DELIBERATE
          # refusals (2 = a row quarantined, 3 = a vendor outage; both mean
          # "commit what arrived, then go red") from an unhandled traceback,
          # which exits 1 partway through the loop. Committing a crashed run's
          # half-written store would publish one immutable snapshot per book at
          # two different market dates. The step still fails with the real code.
          set +e
          python scripts/fetch_ohlcv.py "${FLAGS[@]}"
          rc=$?
          set -e
          case "$rc" in
            0|2|3) echo "committable=true"  >> "$GITHUB_OUTPUT" ;;
            *)     echo "committable=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$rc"

      - name: Resolve commit date
        id: today
        if: ${{ !cancelled() }}
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # data/market/quarantine/ travels with the store: a row the ingest
      # tripwire refused is evidence, and evidence that only exists on an
      # ephemeral runner is no evidence at all.
      #
      # Gated on the script's deliberate exits, not on success alone and not on
      # `!cancelled()`. Both of its non-zero exits mean "commit this, then go
      # red": a quarantined row IS the evidence to preserve, and a partial store
      # after a vendor outage beats no store. Under the default success-only
      # gate this step never ran on either — so the one artifact the quarantine
      # feature exists to produce was discarded with the runner every time, and
      # the failure-rate exit threw away a whole night's good rows with the bad
      # news. A bare `!cancelled()` would go too far the other way and commit a
      # half-written store after a mid-loop crash. The run still fails; the
      # data still lands.
      #
      # data/tickers.json is staged here too: `save_registry` rewrites it on
      # every run and NO workflow was staging it, so the nightly refresh was
      # discarded every night and the file has moved only by hand (three
      # commits, ever). It is currency-resolution layer 2 — a ticker newly
      # added to a universe never acquired an entry, and since the layer-3
      # heuristic now returns None for an unenumerated suffix, the agent's
      # order died at the broker with CURRENCY_UNRESOLVED.
      - name: Commit and push updates
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' }}
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/market/ohlcv/ data/market/quarantine/ data/tickers.json
          message: "[data] ${{ steps.today.outputs.date }} OHLCV update"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "fetch-ohlcv: the price store was not updated"
          body: |
            A scheduled `fetch-ohlcv` run failed. The trading session has no
            outbound HTTP: it prices entirely from the committed store, so a
            store that stops advancing is not a visible outage — the next
            session simply values every book against older closes.

            **Where to look**
            - Yahoo rejecting or throttling the request (the run log prints a
              per-symbol failure count).
            - A push that lost a race with another scheduled writer.
            - `scripts/fetch_ohlcv.py --dry-run` locally to confirm symbol
              resolution still works.
