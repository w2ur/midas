name: session-integrity

# Enforces the load-bearing pipeline rules documented in CLAUDE.md:
#  - A daily-session commit that publishes posts/blog/output MUST also
#    rewrite agent journals (Step 8) and refresh baselines (Step 9).
#    Step numbers match docs/triggers/weekday-session.md — the prose an
#    operator reads next after this error. They disagreed until 2026-08-07,
#    so the two diagnosis paths pointed at different steps.
#  - A weekend-refresh commit MUST update data/baselines/ AND
#    data/leaderboard/current.json.
#  - A session commit that authors real manager orders (data/orders/manager-outbox/)
#    MUST also write the manager-review audit artifact (data/orders/manager-review/).
#    This ensures every Manager trade is traceable: the decision record is load-bearing
#    for the C5b outcome-resolution loop.
# Past silent skips: Apr 20-22 (journals), Apr 25 (baselines).
#
# Scope: commits whose subject starts with
#   "chore: weekday session", "chore: weekend session", "chore: daily session", or
#   "chore: weekend refresh".
# Backfills and manual artifact commits use different messages and pass through.

on:
  push:
    branches: [main]

# `issues: write` for the `alert` job below, or gh 403s and the alert is lost.
permissions:
  contents: read
  issues: write

jobs:
  ledger-integrity:
    # Standing data invariant, independent of commit-message scoping above:
    # every status:"filled" row in data/orders/inbox/ (and each allocator's
    # {prefix}-inbox/) must have a matching trade in the owning agent's
    # data/portfolios/<agent>/trades.json, and vice versa. This is the check
    # that would have caught the 2026-05-18..23 commit_and_push() pathspec
    # bug (see tests/test_ledger_integrity.py module docstring) — a silent
    # data-loss window that went undetected for two months because nothing
    # in CI read data/ content, only diffed file paths. tests.yml only runs
    # on pull_request, and daily-session / watcher-fire / weekend-refresh
    # commits land on main via sandbox-branch auto-merge, which never opens
    # a PR — so this push-triggered workflow is the only gate that sees them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ledger-integrity check
        run: pytest tests/test_ledger_integrity.py -v

      # The arithmetic half of the same question. The existence check above
      # would not notice a trade booked at the wrong notional — which is
      # exactly what the quote-currency defect did to 24 fills, leaving every
      # row present, joined, and EUR 2,057.65 wrong across four books. This
      # reconciliation already existed inside restate_valuations.py as the gate
      # a restatement must pass; it just never ran unless a human ran one.
      - name: Run ledger cash-replay reconciliation
        run: pytest tests/test_ledger_cash.py -v

  append-only:
    # Published dated rows — agent snapshots and baseline series — are frozen
    # once committed. `PortfolioManager.add_snapshot` and
    # `engine.baselines.merge_baseline_series` already enforce that where rows
    # are written, but neither sees a hand edit, a one-off script, or a bad
    # merge resolution, and every published-data incident in this project
    # arrived by one of those routes.
    #
    # A session correcting its OWN row (same session_date) is allowed, exactly
    # as add_snapshot allows it. Anything else needs `[restate]` in the commit
    # message — not a bypass, but the disclosure requirement made mechanical:
    # `git log --grep='\[restate\]'` becomes a complete list of every time the
    # published record moved.
    #
    # Deliberately a post-hoc detector, not a merge gate: it fails main after
    # the fact rather than blocking auto-merge-session, which runs its own
    # inline copy of the artifact rules. Data that has already been written is
    # better reported loudly than held hostage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD^..HEAD. On a session merge commit HEAD^ is main-before-merge,
          # which is the comparison we want.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check published rows are append-only
        run: python scripts/check_append_only.py --base HEAD^ --head HEAD

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Verify session or refresh commit integrity
        run: |
          set -euo pipefail

          msg=$(git log -1 --pretty=%s)
          echo "HEAD commit message: $msg"

          if echo "$msg" | grep -Eq '^chore: (weekday|weekend|daily) session'; then
            mode="session"
          elif echo "$msg" | grep -Eq '^chore: weekend refresh'; then
            mode="refresh"
          else
            echo "Not a session or refresh commit — skipping integrity check."
            exit 0
          fi

          files=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "--- changed files ---"
          echo "$files"
          echo "---------------------"

          touches_artifacts=0
          touches_journals=0
          touches_baselines=0
          touches_leaderboard=0
          touches_manager_outbox=0
          touches_manager_review=0

          if echo "$files" | grep -Eq '^data/(posts|blog|output)/'; then
            touches_artifacts=1
          fi
          if echo "$files" | grep -Eq '^data/agent_memory/.+\.md$'; then
            touches_journals=1
          fi
          if echo "$files" | grep -Eq '^data/baselines/'; then
            touches_baselines=1
          fi
          if echo "$files" | grep -Eq '^data/leaderboard/current\.json$'; then
            touches_leaderboard=1
          fi
          if echo "$files" | grep -Eq '^data/orders/manager-outbox/'; then
            touches_manager_outbox=1
          fi
          if echo "$files" | grep -Eq '^data/orders/manager-review/'; then
            touches_manager_review=1
          fi

          if [[ "$mode" == "refresh" ]]; then
            fail=0
            # Same append-or-refuse caveat as the session branch below: a
            # weekend refresh over an unadvanced store legitimately writes no
            # baseline row. The refresh still has to produce current.json,
            # which is checked separately — so this arm keeps its teeth.
            if [[ $touches_baselines -eq 0 ]]; then
              if python3 scripts/check_session_freshness.py; then
                echo "data/baselines/ unchanged, but every series is level with its snapshots — the refresh ran and correctly wrote nothing."
              else
                echo "::error::Weekend refresh commit leaves the baseline series behind their snapshots."
                fail=1
              fi
            fi
            if [[ $touches_leaderboard -eq 0 ]]; then
              echo "::error::Weekend refresh commit does NOT write data/leaderboard/current.json."
              fail=1
            fi
            if [[ $fail -ne 0 ]]; then
              echo ""
              echo "See CLAUDE.md > Session Cadence."
              exit 1
            fi
            echo "Weekend refresh integrity OK: baselines + current.json present."
            exit 0
          fi

          # mode == "session" checks below.

          fail=0

          # Manager-outbox → manager-review: if a real manager order was authored, the
          # audit artifact (review/{date}.json) MUST also be present. The review is the
          # load-bearing record for the C5b outcome-resolution loop; a missing review
          # means the outcome can never be resolved.
          # NOTE: this check runs BEFORE the artifacts early-return so that a session
          # commit that authors manager orders but publishes no posts/blog/output still
          # fails here.  It is still scoped to session mode (weekend-refresh returned
          # above at ~line 94).
          # COUPLING: "manager-" is hardcoded here because the sole allocator
          # (the-manager) uses channels_prefix="manager" (roster.yaml). If a second
          # allocator is added with a different prefix, extend these grep patterns.
          if [[ $touches_manager_outbox -eq 1 && $touches_manager_review -eq 0 ]]; then
            echo "::error::Session commit authors manager orders (data/orders/manager-outbox/) but does NOT write the manager-review audit artifact (data/orders/manager-review/)."
            fail=1
          fi

          if [[ $fail -ne 0 ]]; then
            echo ""
            echo "See CLAUDE.md > Session Cadence > 'cadence-invariant pipeline rule' and 'load-bearing' notes."
            exit 1
          fi

          # Original guard: posts/blog/output artifacts check.
          if [[ $touches_artifacts -eq 0 ]]; then
            echo "Session commit publishes no artifacts under data/posts|blog|output — nothing to check."
            exit 0
          fi

          fail=0
          if [[ $touches_journals -eq 0 ]]; then
            echo "::error::Session commit publishes posts/blog/output but does NOT rewrite data/agent_memory/*.md (Step 8 skipped)."
            fail=1
          fi
          # An empty diff is NOT evidence that Step 9 was skipped.
          # `merge_baseline_series` is append-or-refuse, so a Step 9 that runs
          # against a series already carrying the session's date writes nothing
          # — which is byte-identical, in the diff, to never having run. That
          # came apart on 2026-08-07: `a4dc9dce2 [restate]` rebuilt every
          # series earlier the same day, and both this guard and the inline
          # copy in auto-merge-session failed a session whose Step 9 was
          # correct. Ask the published state instead: a genuine skip leaves the
          # baselines behind the snapshots (the Apr 25 shape), a correct no-op
          # leaves them level. Stdlib only — no setup-python needed.
          if [[ $touches_baselines -eq 0 ]]; then
            if python3 scripts/check_session_freshness.py; then
              echo "data/baselines/ unchanged, but every series is level with its snapshots — Step 9 ran and correctly wrote nothing."
            else
              echo "::error::Session commit publishes posts/blog/output and the baseline series lag their snapshots (Step 9 skipped)."
              fail=1
            fi
          fi
          # current.json is DERIVED, self-healing state — the watcher refreshes it
          # (hourly for crypto, daily otherwise; try/except, never fatal), the
          # weekend refresh rewrites it,
          # and the next session rebuilds it. The cloud orchestrator often lands the
          # session as two commits — main artifacts first, then a "… — leaderboard"
          # commit carrying current.json — which made this a per-commit FALSE failure
          # (4× in May/Jun 2026). So it is a WARNING here, not a hard failure; the
          # follow-up commit (or the watcher) reconciles it within minutes. Contrast
          # the weekend-refresh mode above, which keeps current.json a hard failure
          # because writing it is that job's entire purpose.
          if [[ $touches_leaderboard -eq 0 ]]; then
            echo "::warning::Session commit does NOT write data/leaderboard/current.json in this commit — non-fatal (derived state; lands in a follow-up '… — leaderboard' commit or via the watcher)."
          fi

          if [[ $fail -ne 0 ]]; then
            echo ""
            echo "See CLAUDE.md > Session Cadence > 'cadence-invariant pipeline rule' and 'load-bearing' notes."
            exit 1
          fi

          echo "Session integrity OK: manager-review (if authored) + artifacts + journals + baselines all present."

  # A red X is not a consumer. These three jobs guard published data — the
  # ledger reconciliation, the append-only freeze on published rows, and the
  # per-mode pipeline contract — and until 2026-08-07 a failure produced
  # nothing but a red tick and an email. That day the `check` job went red on
  # a correct session and the only reason it was noticed was someone asking
  # whether the merge had happened.
  #
  # One reporter for the whole workflow, in a trailing job: a run where all
  # three jobs fail is still ONE fact, and the shared action is idempotent per
  # cause, not per job. `job.status` would be this job's own status (always
  # success — it only reports), so the outcome is aggregated from what it
  # watches. `always()` so it still runs when the jobs it needs have failed.
  alert:
    needs: [ledger-integrity, append-only, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          # One line deliberately: a `>-` block folds *more-indented* lines
          # literally, so the wrapped version of this embedded newlines in the
          # expression rather than spaces.
          outcome: "${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}"
          title: "session-integrity: a published-data guard failed on main"
          body: |
            A push to `main` failed one of the `session-integrity` jobs. All
            three read committed data, so a failure here means the published
            record may be wrong — not merely that a build broke.

            **Which job, and what it means**
            - `ledger-integrity` — a filled inbox row has no matching trade, or
              a book's `initial_capital + replay(trades)` no longer equals its
              recorded cash. Treat as a data incident, not a flaky test.
            - `append-only` — a dated row in `data/portfolios/*/snapshots.json`
              or `data/baselines/**` moved without `[restate]` in the commit
              message. Either the move was unintended, or the disclosure is
              missing.
            - `check` — a session or weekend-refresh commit skipped a
              load-bearing step (journals, baselines, manager-review,
              `current.json` on a refresh).

            **Before assuming the guard is wrong:** it has been, once. On
            2026-08-07 the baselines check read an empty diff as "Step 9
            skipped" when `merge_baseline_series` had correctly written
            nothing. That specific proxy is now a state check
            (`scripts/check_session_freshness.py`); a *new* false positive is
            worth the same scepticism, but verify it rather than assuming it.
