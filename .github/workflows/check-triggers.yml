name: check-triggers

# Runs scripts/check_triggers.py once a day over ALL pending conditional
# orders. The script blacks itself out during 19:55-21:00 UTC to avoid
# commit-races with the daily session. The end was 20:30 until 2026-08-07;
# measured session tails (commit 20:09-20:39, auto-merge to 20:45) ran past
# it. See BLACKOUT_END in scripts/check_triggers.py for the measurements and
# the caveat.
#
# THIS RAN */15, 24/7, UNTIL 2026-08-17, on a header comment that read
# "Midas is a public repo → unlimited GitHub Actions minutes, so a 15-min
# cadence is free". Midas was PRIVATE from its creation on 2026-04-15 until
# 2026-08-19 — the only public repo was the midas-core mirror — so the premise
# was false when it was written, a month after the repo existed. Measured cost of
# that belief in the 2026-08 cycle: 441 runs, 923 billed minutes, 46% of the
# account's entire 2,000-minute monthly quota, to perform ~44 minutes of
# actual work. The remaining 93% was setup: 26s checkout (.git is 836 MB),
# 7s setup-python, 48s installing all 120 pinned packages, for a script whose
# run step takes 6 seconds.
#
# NOTE (2026-08-19): the repo is now public, so Actions minutes are free and
# the billing premise behind this cadence no longer holds. The cadence is
# deliberately left unchanged here — revisiting it is its own decision, and a
# daily full sweep is still the right shape for prices that move once a day.
#
# Push path (2026-09-05): each fill is committed and pushed `HEAD:main` with a
# rebase-retry. If main refuses it — a branch-protection rule did exactly that
# for every bot push from 2026-08-24 to 09-04, and TEN fired orders died with
# their runners and re-fired later at other prices (METHODOLOGY
# `#watcher-outage-2026-08-24`) — the script pushes the commit to a per-run
# `triggers/<date>-<run id>` branch instead and exits 0 with a ::warning::.
# The merge-fallback-branches step then dispatches auto-merge-session.yml for
# it (a dispatch, because a GITHUB_TOKEN push fires no `on: push`). A commit is
# lost with the runner ONLY if it reaches neither main nor that branch, and
# that is the case that exits 1 below. A run that finds an unmerged
# `triggers/*` branch on origin refuses to evaluate (exit 1) rather than
# re-fire behind a main that lacks the fill.
#
# That merge step runs TWICE, before and after the watcher (round-2 review,
# 2026-09-05). Dispatching only afterwards meant a branch waiting from
# yesterday cost this run its whole evaluation — fires and expiries — because
# the watcher refuses while one exists, and only then was the merge asked for.
# The leading call dispatches and waits for the branch to land; the checkout is
# then re-anchored on main's new tip, because a depth-1 checkout from job start
# would otherwise still show the pending file of an order main has just filled,
# and check_triggers.py refuses on exactly that mismatch.
#
# Daily is the correct cadence for THIS workflow because non-crypto triggers
# cannot change more often than that: engine.triggers.get_current_price reads
# them from the committed OHLCV store via latest_close_on_or_before, and
# fetch-ohlcv.yml refreshes that store once a day. Crypto is the only class
# that moves intraday (live ccxt fetch, 24/7) and it now has its own hourly
# workflow, check-triggers-crypto.yml. This one remains the full sweep — it is
# a superset, and it is the SOLE owner of expiry, which is date-based and so
# only ever needs evaluating once a day.

on:
  schedule:
    # 13:00 UTC, not 06:30. This wants to run after fetch-ohlcv.yml (cron
    # 0 6 * * *) has landed the day's closes, but GitHub's scheduler is never
    # on time: measured across this repo, runs typically land 40 min to 2 h 45
    # late with a tail past 5 h. A 30-minute gap would routinely lose the race
    # and evaluate yesterday's store. 13:00 clears the documented tail and
    # still sits well before the 19:55 blackout.
    #
    # Losing that race is not a correctness failure — the sweep would read the
    # previous close, which is what it read all of the previous day anyway, and
    # the next day's run picks the new one up. It is a freshness cost, which is
    # why this is a cron with slack rather than a workflow_run dependency.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to commit fills/expiries back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue
  actions: write   # to dispatch auto-merge-session.yml for a fallback branch

concurrency:
  group: check-triggers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore watcher venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          # Same key as check-triggers-crypto.yml and tests.yml's watcher-env
          # job — the three deliberately share one cache. See the crypto twin
          # for why the interpreter patch version is part of the key.
          key: watcher-venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-watcher.txt') }}

      - name: Build watcher venv (cache miss only)
        # requirements-watcher.txt, not requirements.txt: this runs the SAME
        # script the crypto twin already runs from the 36-package slim lockfile,
        # while installing the 120-package full one cost 49s of a 91s job — two
        # billed minutes for a job whose work is seconds. Pins are a strict
        # subset of the root lockfile's, enforced by tests/test_ci_guards.py,
        # and tests.yml's watcher-env job proves this env can import the script.
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-watcher.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # BEFORE the watcher, not only after it (round-2 review, 2026-09-05).
      # scripts/check_triggers.py refuses to evaluate while any triggers/*
      # branch is on origin, so a merge that was deferred inside the session
      # window or lost its dispatch used to cost the NEXT sweep its whole
      # evaluation: it exited before firing or expiring anything, and only
      # then dispatched the merge. Every trigger and expiry due that day
      # waited for the following dispatch. Dispatching first and waiting for
      # the branches to disappear lets one run merge and then evaluate. The
      # wait is bounded and a timeout is not a failure — the watcher below
      # refuses exactly as it did before, and the trailing call re-dispatches.
      - name: Merge any waiting fallback branch before evaluating
        uses: ./.github/actions/merge-fallback-branches
        with:
          wait-seconds: "180"

      # The step above may have just pushed a fill to main, and the checkout
      # is from job start with `fetch-depth: 1`. scripts/check_triggers.py
      # refuses to evaluate when origin/main is not this HEAD (see
      # main_tip_ahead_of_checkout) — correctly, because the worktree would
      # otherwise show the pending file of an order main has already filled.
      # So re-anchor before evaluating. `--depth=1`: a plain `git fetch` into
      # a shallow checkout deepens it, and this repo's history is gigabytes.
      - name: Re-anchor the checkout on main's current tip
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          echo "evaluating against $(git rev-parse HEAD)"

      - name: Run watcher
        run: .venv/bin/python scripts/check_triggers.py

      # scripts/check_triggers.py's write_run_report() writes the run's
      # fired/expired table to $RUNNER_TEMP/watcher-report.md (and its JSON
      # twin next to it). $RUNNER_TEMP is one directory for the whole job,
      # which is the point: this step used to read $GITHUB_STEP_SUMMARY, and
      # that file is PER-STEP — GitHub: "unique to the current step and
      # changes for each step in a job" — so it read its own fresh, empty
      # file every time and `details` reached the issue empty on 100% of runs.
      # `if: always()`: the watcher may have exited 1, and the report is what
      # tells a reader WHAT failed.
      - name: Read watcher run report
        id: report
        if: always()
        run: |
          report="$RUNNER_TEMP/watcher-report.md"
          if [[ -s "$report" ]]; then
            {
              echo "table<<WATCHER_REPORT_EOF"
              cat "$report"
              echo "WATCHER_REPORT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "table=" >> "$GITHUB_OUTPUT"
          fi

      # The JSON twin's consumer. $RUNNER_TEMP dies with the runner; the
      # artifact does not. `if-no-files-found: ignore`: a blacked-out run and
      # a run that refused to evaluate write no report, and that is not a
      # failure of this step.
      - name: Upload watcher run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-report-${{ github.run_id }}
          path: ${{ runner.temp }}/watcher-report.*
          if-no-files-found: ignore
          # A re-run attempt reuses the run id; without this v4 refuses the
          # duplicate name and the re-run's report is the one that is lost.
          overwrite: true
          retention-days: 30

      # `if: always()`: a run that refused because a fallback branch is still
      # unmerged is the run that should get it merged. See the action header.
      - name: Merge any fallback branch into main
        if: always()
        uses: ./.github/actions/merge-fallback-branches

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "check-triggers: the daily conditional-order sweep did not complete"
          details: ${{ steps.report.outputs.table }}
          body: |
            The daily 13:00 UTC `check-triggers` sweep failed.

            This is the money path, and since 2026-08-18 it is also the ONLY
            scheduled evaluation of conditional orders: the crypto watcher is
            dispatch-only, fired by the `workers/trigger-gate/` Cloudflare
            Worker. So a failure here is not a degraded cadence, it is no
            cadence — pending orders are neither fired nor expired until this
            runs again.

            **Expiry is this job's alone.** The crypto pass filters non-crypto
            orders out in `run()` precisely so it can never retire one early,
            which means an order that should have expired today simply did not.

            Read the run log for which of these it was — the watcher decides
            its exit code last, after every order was evaluated and every
            push attempted, and says why:

            - **"Refusing to evaluate: unmerged fallback branch(es)"** — a
              previous run's fills sit on a `triggers/*` branch that has not
              reached `main`. Nothing was evaluated (on purpose: evaluating
              against a `main` that lacks those fills would re-fire the same
              orders at a new price). This run already dispatched the merge
              BEFORE evaluating and waited for it; that it still refused means
              the merge did not land, and `auto-merge-session` has filed its
              own issue saying why — deferred inside the session window, stale
              against main, or refused for scope.
            - **"Refusing to evaluate: origin/main moved since this
              checkout"** — another writer landed on `main` between
              `actions/checkout` and the guard. Nothing was evaluated, nothing
              is lost, and the next run checks out the new tip. If it repeats,
              a writer is pushing to `main` on a tight loop.
            - **"reached NEITHER origin/main nor the fallback branch"** — the
              double failure. This is the only case where a fill is lost with
              the runner: the pending file is back on the next checkout and
              the next run re-fires it at the price of that day. The run log
              names the order and the price it filled at.
            - **"execute_triggered_order failed"** — the broker raised on a
              fired trigger; the pending file survives and the order retries.

            A refused push on its own is NOT here: the fill went to a
            `triggers/*` branch, the run exited 0 with a `::warning::`, and
            `auto-merge-session.yml` merges it.
