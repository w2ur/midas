name: check-triggers

# Runs scripts/check_triggers.py every 15 minutes to evaluate pending
# conditional orders against live prices. The script blacks itself out
# during 19:55-21:00 UTC to avoid commit-races with the daily session.
# The end was 20:30 until 2026-08-07; measured session tails (commit
# 20:09-20:39, auto-merge to 20:45) ran past it. See BLACKOUT_END in
# scripts/check_triggers.py for the measurements and the caveat.
#
# Midas is a public repo → unlimited GitHub Actions minutes, so a 15-min
# cadence is free. GitHub's cron has known slippage at sub-hourly cadence
# (5-20 min delays under load) — that's acceptable for trim/stop semantics
# at our scale; if we ever need sub-minute reliability we'd graduate to
# Cloudflare Workers Cron.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to commit fills/expiries back to main

concurrency:
  group: check-triggers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run watcher
        run: python scripts/check_triggers.py
