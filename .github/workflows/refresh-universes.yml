name: refresh-universes

# Re-fetches index universes (S&P 500, Nasdaq-100, CAC 40, DAX, FTSE 100,
# STOXX 600, Dow 30) from their upstream sources — Wikipedia, Slickcharts,
# and for the STOXX 600 DWS's constituent export resolved ISIN by ISIN
# through Yahoo's lookup (since 2026-09-09; the Wikipedia ticker column
# produced 120 symbols Yahoo could not route, issue #36) — and re-seeds the
# alternative universes from their curated fallback lists. Commits any diff back to main so the
# cloud trading sandbox — which has no outbound HTTP — can read the
# committed data/universes/*.json files at session time.
#
# Cadence: weekly. Index constituents change on the order of "a few names
# per quarter," so a weekly refresh is plenty. Also exposes
# workflow_dispatch for manual runs after a Wikipedia layout change.

on:
  schedule:
    - cron: "15 03 * * 1"  # Monday 03:15 UTC, well before any trading session
  workflow_dispatch:

permissions:
  actions: write  # dispatch session-integrity on the commit this run pushes
  contents: write
  issues: write  # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: refresh-universes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The STOXX 600 pass is ~605 throttled Yahoo lookups: measured ~6 min on
    # 2026-09-09 including one rate-limit back-off. The retry schedule can add
    # another ~1.5 min per rate-limited ISIN, so 10 was too tight.
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh universes
        run: python scripts/refresh_universes.py

      # Runs even when the refresh step exits non-zero (a skipped index):
      # the successful indexes still get committed, while the job stays red
      # so the owner gets the workflow-failure email. A broken scraper must
      # neither stall the other indexes nor fail silently.
      - name: Resolve commit date
        if: ${{ success() || failure() }}
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The sha the dispatch step at the end compares against: a commit only
      # counts as this run's if HEAD moved after this point.
      - name: Record HEAD before writing
        id: before
        # always(): a writer that went red after its fetch (fetch-ohlcv exit 2/3,
        # refresh-universes) still pushes, and without this the step is skipped.
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        if: ${{ success() || failure() }}
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/universes/
          message: "[data] ${{ steps.today.outputs.date }} universe refresh"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "refresh-universes: index constituents were not refreshed"
          body: |
            The weekly `refresh-universes` run failed — usually a Wikipedia
            layout change breaking one index's scraper.

            The failure degrades slowly rather than loudly: the committed
            `data/universes/*.json` files stay readable, so sessions keep
            running against an increasingly stale constituent list. The
            universe allowlist is also a broker safety rail, so a stale list
            quietly changes what agents are permitted to trade.

            **Where to look**
            - The refresh step's log names the index that failed.
            - `python scripts/refresh_universes.py` locally against the live
              page markup.

      # A GITHUB_TOKEN push starts no `on: push` run, so session-integrity
      # would never see this run's commit. After the reporter on purpose: see
      # .github/actions/dispatch-session-integrity.
      - name: Dispatch session-integrity on the commit this run pushed
        if: always()
        uses: ./.github/actions/dispatch-session-integrity
        with:
          before: ${{ steps.before.outputs.sha }}
