name: eu-close-probe

# TEMPORARY DIAGNOSTIC — delete once the question below is answered.
#
# Question: at what hour, if any, is a European equity's DAILY CLOSE actually
# usable from Yahoo?
#
# Why this exists. The OHLCV store has carried European closes one trading day
# behind American ones since the desk started, and two attempts to fix it by
# moving the fetch hour both failed because both were built on a guess about
# the mechanism. What is now established, by measurement:
#
#   * 2026-08-11 20:47 UTC — SAP.DE returned a real price for 08-11, the SAME
#     day, ~5 h after the 15:30 UTC bell.
#   * 2026-08-10 23:24 UTC — the 22:30 fetch could not get 08-10 at all.
#   * 2026-08-13 07:17 UTC — the 06:00 fetch got 08-12 as a row with a NULL
#     close. Row served, price field empty. 380 European symbols in one run.
#   * 2026-08-14 07:10 UTC — 08-12 now populated (175.96); 08-13 absent.
#
# So a European close appears to be: usable the same evening, then null or
# absent for roughly a day, then usable again. Both the 22:30 and 06:00 fetches
# sit inside that dead zone. THIS IS A HYPOTHESIS, not a finding — it rests on
# a single evening observation, and two previous hypotheses about this same
# behaviour were wrong. That is what this probe is for.
#
# It is READ-ONLY. It fetches nothing into the store, commits nothing, pushes
# nothing. Results go to the job summary; collect them with:
#   gh run list --workflow=eu-close-probe.yml --limit 20
#   gh run view <id> --log
#
# It deliberately does NOT use .github/actions/push-with-retry, does not touch
# data/, and cannot fail a session. A probe that can break the desk it measures
# is not a probe.

on:
  # PAUSED 2026-08-18: August's Actions quota is nearly exhausted (~268 min
  # left of 2,000; the meter resets 00:00 UTC on Sep 1). At ~5 runs a weekday
  # this probe costs ~108 min/month, which is real money against that ceiling
  # and buys an answer that keeps until September. Phase 2 (locate the
  # withdrawal edge between 20:18 and 22:23) resumes by uncommenting the five
  # crons below on/after 2026-09-01. The 18:00 positive control comes back WITH
  # them — a probe without its control proves nothing, which is the whole
  # reason it survived the 08-17 trim.
  # schedule:   (uncomment this key together with the five crons below)
    # Phase 1 (2026-08-14, ANSWERED) — bracket the transition in both
    # directions. Result, on 08-14 and confirmed on 08-17: a European close is
    # POPULATED same-day from ~17:00 to at least 20:18 UTC, NULL by 22:23, still
    # NULL at 02:51 and 07:22, and RESTORED by the next afternoon. The 22:30 and
    # 06:00 fetch hours both sat inside the withdrawal window — that is the
    # five-week European staleness, measured rather than hypothesised. AAPL and
    # MSFT stayed populated throughout; LSE withdraws later than XETRA/Euronext,
    # and SIKA.SW (SIX) never withdrew.
    #
    # **"So the withdrawal is European-specific" was the conclusion drawn from
    # that, and it is WRONG — retracted 2026-08-18.** Those samples were of the
    # SAME DAY's close, taken the same evening. The withdrawal that matters is
    # the NEXT MORNING's, and it takes the US with it: measured 07:28 UTC on
    # 2026-08-18, `yf.download` served Monday 08-17 as a row with a NaN close
    # for AAPL and URTH alike, and the 06:00 fetch that morning logged
    # `dropped 1 row(s) with no close - 2026-08-17` for US and European names
    # side by side (ADBE, ADI, ADP next to ADS.DE, ADYEN.AS). 952 of the store's
    # 1,150 symbols were still sitting on Friday 08-14.
    #
    # So the 06:00 relocation did not escape the dead zone, it only changed
    # which side of it the fetch lands on, and the store runs a trading day
    # behind for EVERY cash equity rather than just the European ones. Phase 2's
    # question is therefore worth more than "where is the edge": the answer
    # names the hour at which one fetch could capture both regions' previous
    # closes. Note it can also be asked for free from a laptop — the probe above
    # is three lines of yfinance — which is how this retraction was measured
    # while the workflow itself was paused.
    # Phase 1's crons are RETIRED now that it is answered — they cost 25 runs
    # a week to keep re-confirming a settled result, and this repo is on a
    # GitHub Actions budget (the whole schedule was cut from 672 runs/week to
    # ~242 on 2026-08-17). `0 18` survives as phase 2's POSITIVE CONTROL, not
    # as a leftover: without a sample known to precede the withdrawal, a NULL
    # at 20:30 cannot be told apart from a close that never appeared that day
    # at all — which is the same "a check that cannot fail" trap the rest of
    # this repo is built against. Retired: `0 16 * * 1-5`, `0 2 * * 2-6`,
    # `0 7 * * 2-6`.
    # - cron: "0 18 * * 1-5"   # positive control: populated well before the edge
    #
    # Phase 2 (2026-08-17, OPEN) — where exactly, between 20:18 and 22:23, is
    # the European close withdrawn? It matters because AAPL's same-day close was
    # ALREADY FINAL at 20:18 (305.93, unchanged at 22:23 and 02:51) while Europe
    # was still populated. If that overlap is real and wide enough, ONE fetch in
    # it captures both regions' same-day closes — which this desk has never had.
    #
    # Deliberately more cheap crons rather than one long in-run sampling loop.
    # The scheduler's lateness makes a fine cron grid useless as a grid — this
    # workflow's `0 16` cron has fired at 16:37 and at 17:01 — but every sample
    # PRINTS ITS OWN UTC TIMESTAMP, so an observation labels itself and jitter
    # merely scatters the samples across the window we want covered. That turns
    # the scheduler's worst property into sampling coverage, at ~2 runner-minutes
    # per sample instead of the ~135 a 15-minute loop over the same window costs.
    # - cron: "30 20 * * 1-5"
    # - cron: "0 21 * * 1-5"
    # - cron: "30 21 * * 1-5"
    # The far edge, measured NULL on 08-14. Both ends of the bracket have to
    # survive the trim: three populated samples with no known-NULL sample
    # after them cannot distinguish a withdrawal at 21:45 from one at 23:00.
    # - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eu-close-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the root lockfile's version so the probe measures what the
      # real fetch would see. If requirements.txt moves, move this with it.
      - name: Install yfinance
        run: pip install --quiet yfinance==1.5.1

      - name: Probe
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import datetime as dt
          import math
          import os
          import warnings

          import yfinance as yf

          warnings.filterwarnings("ignore")

          # Spread across exchanges: a per-venue difference is exactly the kind
          # of thing a single-symbol probe would miss. AAPL/MSFT are controls —
          # if they ever go absent the run is measuring an outage, not Europe.
          EUROPE = [
              "SAP.DE", "SIE.DE", "ALV.DE",      # XETRA
              "AI.PA", "OR.PA", "AIR.PA",        # Euronext Paris
              "ASML.AS",                          # Euronext Amsterdam
              "BP.L", "HSBA.L",                  # LSE
              "ISP.MI",                           # Borsa Italiana
              "SIKA.SW",                          # SIX
          ]
          CONTROLS = ["AAPL", "MSFT"]

          now = dt.datetime.now(dt.timezone.utc)
          # Five sessions back is enough to see the fill happen without making
          # the request window itself a variable.
          start = (now - dt.timedelta(days=7)).date()
          end = (now + dt.timedelta(days=1)).date()
          dates = [(now.date() - dt.timedelta(days=i)) for i in range(4)][::-1]

          def state(v):
              if v is None:
                  return "absent"
              if isinstance(v, float) and math.isnan(v):
                  return "NULL"
              return f"{float(v):.2f}"

          print(f"## EU close probe — {now:%Y-%m-%d %H:%M} UTC")
          print()
          print(f"cron `{os.environ.get('SCHEDULE') or 'manual'}`")
          print()
          header = "| symbol | " + " | ".join(d.isoformat() for d in dates) + " |"
          print(header)
          print("|---" * (len(dates) + 1) + "|")

          for sym in EUROPE + CONTROLS:
              try:
                  df = yf.download(
                      sym, start=str(start), end=str(end),
                      progress=False, auto_adjust=False, threads=False,
                  )
                  got = {}
                  if df is not None and not df.empty:
                      for ts, close in zip(df.index, df["Close"].squeeze()):
                          got[ts.date().isoformat()] = close
              except Exception as exc:  # a probe never fails the run
                  print(f"| {sym} | error: {type(exc).__name__} |")
                  continue
              cells = " | ".join(state(got.get(d.isoformat())) for d in dates)
              mark = "" if sym in EUROPE else " *(control)*"
              print(f"| {sym}{mark} | {cells} |")

          print()
          print("`NULL` = Yahoo served the row with an empty price field.")
          print("`absent` = no row for that date at all.")
          PY
