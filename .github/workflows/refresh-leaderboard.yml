name: refresh-leaderboard

# Weekend valuation-only refresh. No agent dispatch — runs Sat/Sun 20:00 UTC
# to advance snapshots, refresh baselines, and write data/leaderboard/current.json.
# Weekday equivalents are handled inside scripts/daily_session.py (via the
# weekday RemoteTrigger session prose at docs/triggers/weekday-session.md).
#
# Idempotency contract: snapshots are append-once-per-date, baselines are
# full-rewrite, current.json is full-overwrite. Re-running on the same date
# is safe; commit is a no-op when nothing changed.

on:
  schedule:
    - cron: "0 20 * * 6,0"  # Sat + Sun 20:00 UTC
  workflow_dispatch:

permissions:
  actions: write  # dispatch session-integrity on the commit this run pushes
  contents: write
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: refresh-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Full history so the push step can rebase on an advanced main when a
          # concurrent commit races the refresh (see _push_with_rebase_retry).
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The sha the dispatch step at the end compares against: a commit only
      # counts as this run's if HEAD moved after this point.
      - name: Record HEAD before writing
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run weekend refresh
        run: python scripts/refresh_leaderboard.py

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "refresh-leaderboard: the weekend valuation refresh did not complete"
          body: |
            A scheduled weekend `refresh-leaderboard` run failed.

            This job's entire purpose is to write `data/leaderboard/current.json`
            and the weekend snapshot/baseline points — which is why
            `session-integrity` treats a missing `current.json` as a HARD
            failure on a weekend-refresh commit rather than the warning it is
            on a session commit.

            Consequence to expect: the public leaderboard keeps serving the last
            good artifact, with a stale `updated_at`. Snapshots are keyed on the
            market date and are immutable, so a late re-run writes the missed
            weekend point only if no later session has already published that
            date.

      # A GITHUB_TOKEN push starts no `on: push` run, so session-integrity
      # would never see this run's commit. After the reporter on purpose: see
      # .github/actions/dispatch-session-integrity.
      - name: Dispatch session-integrity on the commit this run pushed
        if: always()
        uses: ./.github/actions/dispatch-session-integrity
        with:
          before: ${{ steps.before.outputs.sha }}
