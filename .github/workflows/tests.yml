name: tests

# Two suites, two jobs: `pytest` (Python engine + scripts + backtester) and
# `site-tests` (the Astro site's vitest suite). Both run on every trigger
# below; neither gates the other.
#
# Runs the full pytest suite (incl. the import-smoke guard) on every pull
# request AND on every code-bearing push to `main`. The PR trigger is the
# pre-merge gate; the push trigger closes the hole behind it — a commit pushed
# straight to main (as the 2026-07-31 session-guard fix was) opens no PR, so
# with pull_request alone nothing ever exercised the suite against what main
# actually holds. The cron workflows and session-integrity do run on main, but
# neither runs pytest.
#
# `paths-ignore`, not `paths`, deliberately: an allowlist silently stops
# covering any code directory added later, which is the same bypass-by-omission
# class this trigger exists to close. Everything not listed below runs the
# suite. The list is kept as short as the coupling allows:
#   data/**  — the daily session's only footprint, so a session commit never
#              triggers a run (the sandbox auto-merge path inherits this).
#              Accepted risk: data/universes/*.json is read by the resolvers,
#              so a refresh-universes commit is unverified here.
#   docs/**  — no code or test reads it (verified, not assumed).
#   *.md     — root-level only. `*` does not cross `/`, so .claude/agents/*.md
#              stays covered: test_persona_dispatch reads those personas.
# site/** is deliberately NOT ignored: tests/test_reason_codes.py reads
# site/src/lib/rails.ts and asserts it matches REJECTION_REASON_CODES, so a
# site-only edit can fail pytest.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Superseding a PR run is free — the newer commit is what matters. On main
  # each commit is already published, so every run must complete: cancelling
  # one leaves a commit on main with no verdict, the very gap being closed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git
        # Some tests drive real git repos (e.g. the push-race rebase-retry).
        # A clean runner has no global identity and defaults new repos to
        # 'master'; the suite assumes 'main' + an identity, like a dev machine.
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@midas.local"
          git config --global user.name "Midas CI"

      - name: Run test suite
        run: pytest -q

  # The site's 197 vitest tests had never run in CI: no node job existed in any
  # workflow, so `site/tests/ohlcv.test.ts`'s double-divide regression (which
  # reads the real committed OHLCV store), the WCAG contrast guard, the
  # ledger-notes anchor checker and the hub-feed projection tests were all
  # green-by-never-executing. They ran only when someone typed `npm test` in
  # `site/`.
  #
  # No per-job path filter, for the same reason the pytest job uses
  # `paths-ignore` rather than an allowlist: the site suite reads committed
  # engine artifacts (`data/market/ohlcv`, `data/ticker_currencies.json`,
  # METHODOLOGY.md anchors), so "site tests only matter when site/** changes"
  # is false. It is a ~40s node job; running it on every trigger costs less
  # than reasoning about which paths can reach it.
  site-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run site test suite
        working-directory: site
        run: npm test

  # The watcher runs on a NARROWED lockfile (requirements-watcher.txt, 36
  # packages against the root's 120) because installing the full one pushed
  # each run past GitHub's 60-second billing edge. Only the pins were guarded —
  # tests/test_ci_guards.py checks they mirror the root lockfile's versions —
  # and nothing proved the narrowed set could actually IMPORT the script it
  # exists to run. A new transitive import anywhere under engine.* would have
  # surfaced as an ImportError in production, on a dispatched money-path run.
  #
  # Drill (2026-08-18): removing pyyaml from a slim env makes this fail with
  # ModuleNotFoundError at engine/config.py:19. It is not a guard that cannot
  # fail.
  watcher-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore watcher venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          # Same key as check-triggers{,-crypto}.yml — the three share one
          # cache, so this job usually also warms the one the watchers restore.
          key: watcher-venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements-watcher.txt') }}

      - name: Build watcher venv (cache miss only)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-watcher.txt

      - name: The watcher env can import the watcher
        run: .venv/bin/python -c "import scripts.check_triggers"

  # The Cloudflare gate's own tests. Nothing else ran them: `site-tests` is
  # vitest scoped to site/, and the Python parity guard only covers `isLive`
  # and the two Set literals. So `shouldDispatch`, TOLERANCE's one-sidedness
  # and `gateable` had tests but no execution — inverting the tolerance band
  # (1 - TOLERANCE <-> 1 + TOLERANCE) would turn every gate decision into a
  # systematic under-dispatch and merge green.
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step: the gate is dependency-free by design and its tests
      # use node:test, so there is no lockfile to cache and nothing to fetch.
      - name: Run the trigger-gate test suite
        run: node --test 'workers/trigger-gate/test/*.test.mjs'

  # Both suites above are unconditional, which is deliberate — but "unconditional"
  # is a property of the file as it reads today, not a guarantee. Add a `paths`
  # filter, an `if:`, or drop a job from a `needs:` list, and the run still ends
  # green: Actions reports a skipped job as `skipped` and an absent one as
  # nothing, and neither is a failure. The suites would then be
  # green-by-never-executing — the same defect the `site-tests` comment above
  # records, one level up.
  #
  # So this job asserts a NAMED list rather than aggregating whatever `needs`
  # happens to contain. The shorter form is worse than no gate at all:
  #
  #   $ echo '{}' | jq -e 'all(.[]; .result == "success")'
  #   true          # exit 0 — zero coverage reports success
  #
  # `all` over an empty collection is vacuously true. Keep the loop.
  # If a suite is added to this workflow, add its job id to EXPECTED.
  # `watcher-env` is in the list for that reason: it is a suite of one assertion,
  # but a suite that can be dropped silently is exactly what EXPECTED refuses.
  gate:
    needs: [pytest, site-tests, watcher-env, worker-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aucune suite ne peut être verte par omission
        env:
          # Through the environment, not interpolated into the script body:
          # ${{ }} inside `run:` is textual substitution into a shell.
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: '["pytest","site-tests","watcher-env","worker-tests"]'
        run: |
          set -uo pipefail
          fail=0

          if [ "$(jq -r 'length' <<<"$EXPECTED")" -eq 0 ]; then
            echo "::error::aucune suite attendue — une porte sans attente est verte par omission"
            exit 1
          fi

          echo "--- suites attendues ---"
          while IFS= read -r job; do
            res=$(jq -r --arg j "$job" '.[$j].result // "ABSENT"' <<<"$NEEDS")
            if [ "$res" = "success" ]; then
              printf '  ok        %-12s %s\n' "$job" "$res"
            else
              printf '  MANQUANT  %-12s %s\n' "$job" "$res"
              echo "::error::$job était attendu et vaut '$res'"
              fail=1
            fi
          done < <(jq -r '.[]' <<<"$EXPECTED")

          while IFS= read -r job; do
            res=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case "$res" in
              success|skipped) ;;
              *) echo "::error::$job = $res"; fail=1 ;;
            esac
          done < <(jq -r 'keys[]' <<<"$NEEDS")

          if [ "$fail" -eq 0 ]; then
            echo "Porte verte : les deux suites ont tourné et sont passées."
          fi
          exit "$fail"
