name: resweep-held-tickers

# Weekly corporate-action (stock split) detection, scoped to the tickers
# some agent actually holds — the only set where a split changes a real
# number. Runs `scripts/fetch_ohlcv.py --resweep-held`, which resolves its
# own symbol list from `_collect_holdings()` (union of every open position
# across all 12 books, typically ~30 tickers) and re-fetches a 90-day
# window against the already-committed store, with every row in it
# revisable — the same full-history-overlap comparison `--resweep` uses,
# which `engine.corporate_actions.detect_split` needs to tell a real split
# (every drifted row at the SAME ratio) from ordinary drift (scattered
# ratios). 90 days is ample — real splits leave hundreds of drifted rows —
# and cheap at this symbol count.
#
# DO NOT WIDEN THIS WINDOW without re-running the detection fixtures. It is
# an upper bound, not just a lower one. detect_split refuses a window holding
# a second drifted body older than the split, because a stacked history has
# no single correct adjustment factor — the right one depends on when each
# position was opened. WLN.PA (a real 40:1 reverse on 2026-06-15) sits behind
# exactly such a body: measured, it detects at 90 days (0.025) and returns
# None at 180, 365 and full history. Widening this therefore silently turns a
# real detection into a miss.
#
# Why a scheduled trigger exists at all: the nightly fetch-ohlcv.yml run
# only ever re-requests a 1-day trailing revision window, which structurally
# cannot clear detect_split's "at least a handful of overlapping rows"
# minimum. Without a periodic full-window resweep of the held set, a real
# split would silently re-adjust all of Yahoo's history, the nightly run
# would write one revised row, and nothing would ever notice — 11 tickers
# split in under four months during this experiment's first four months.
#
# Cadence: weekly is enough — a split's ex-date rarely lands more than a
# few trading days before a name is discovered by this job, and the failure
# mode it guards against (a stale share count silently mis-valuing a book)
# degrades slowly, not catastrophically, between runs.
#
# Scheduled well clear of every other cron this repo runs: the 19:55-21:00
# UTC blackout the trigger watcher (check-triggers.yml) observes around the
# daily session, the 06:00 UTC (daily) full fetch-ohlcv.yml runs, and
# refresh-universes.yml's Monday 03:15 UTC slot.
# "Clear of" is a statement about the *nominal* schedule and nothing more:
# GitHub's scheduler runs 42 min to 6 h late, so overlap is possible and the
# push goes through .github/actions/push-with-retry rather than relying on it
# not happening.

on:
  schedule:
    - cron: "10 05 * * 1"  # Monday 05:10 UTC
  workflow_dispatch:

permissions:
  contents: write  # needed to commit OHLCV/portfolio updates back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: resweep-held-tickers
  cancel-in-progress: false

jobs:
  resweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Same exit-code contract as fetch-ohlcv.yml — this runs the same script,
      # so it inherits the same deliberate refusals. It matters more here: the
      # held set is ~39 tickers and all of them are store-covered, so four
      # vendor misses is already 10.3% and trips the failure-rate exit.
      - name: Resweep held tickers (split detection)
        id: fetch
        run: |
          set +e
          python scripts/fetch_ohlcv.py --resweep-held --history-days 90
          rc=$?
          set -e
          case "$rc" in
            0|2|3) echo "committable=true"  >> "$GITHUB_OUTPUT" ;;
            *)     echo "committable=false" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$rc"

      - name: Resolve commit date
        id: today
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' }}
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Touches two directories: data/market/ohlcv/ (the resweep itself) and
      # data/portfolios/ (only when a split was actually detected and a held
      # position adjusted — most weeks this is empty). That second one is why
      # this job of all four most needs the retry: a lost push here silently
      # discards a share and cost-basis correction for a week.
      #
      # And why it needs the gate: `_apply_split_to_holders` calls
      # PortfolioManager.apply_split, which PERSISTS portfolio.json mid-loop.
      # Under the default success-only condition, a later failure-rate exit in
      # the same run skipped this step and discarded a correction that had
      # already been written — the exact loss the paragraph above describes,
      # arriving by a route the retry loop cannot help with.
      - name: Commit and push updates
        if: ${{ !cancelled() && steps.fetch.outputs.committable == 'true' }}
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/market/ohlcv/ data/portfolios/
          message: "[data] ${{ steps.today.outputs.date }} held-ticker resweep"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "resweep-held-tickers: split detection did not run"
          body: |
            The weekly `resweep-held-tickers` run failed. This is the ONLY
            scheduled trigger for corporate-action detection: the nightly
            `fetch-ohlcv` run uses a 1-day revision window, which structurally
            cannot give `detect_split` the historical overlap it needs.

            While this is failing, a real split silently leaves a stale share
            count valued against a post-split price — the book is mis-valued by
            the split ratio, and nothing else in the pipeline will notice.

            **Where to look**
            - The resweep step's log for a Yahoo failure.
            - A lost push: this job's commit can carry `data/portfolios/`
              adjustments from `PortfolioManager.apply_split`, so a discarded
              push discards a real portfolio correction.
