name: fetch-sentiment

# Fetches news digests for active portfolio tickers and commits updates to
# data/market/news/. The sandboxed trading session reads from the committed
# repo (no network), so this workflow is what keeps sentiment data fresh.
#
# Schedule: Mon-Fri 19:00 UTC — BEFORE the 20:00 UTC trading session and
# clear of the 19:55-20:30 UTC watcher blackout window.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "0 19 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date in YYYY-MM-DD format (default: today UTC)"
        required: false
        default: ""

permissions:
  contents: write  # needed to commit news digests back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: fetch-sentiment
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch sentiment digests
        env:
          RUN_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          FLAGS=()
          if [[ -n "$RUN_DATE" ]]; then
            # Validate: only accept YYYY-MM-DD format
            if [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              FLAGS+=(--date "$RUN_DATE")
            else
              echo "Invalid date format '${RUN_DATE}', using today."
            fi
          fi
          python scripts/fetch_sentiment.py "${FLAGS[@]}"

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain data/market/news/)" ]]; then
            echo "No sentiment changes to commit."
            exit 0
          fi

          git add data/market/news/
          DATE=$(date -u +%F)
          git commit -m "[data] ${DATE} sentiment digests"
          git push

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "fetch-sentiment: news digests were not refreshed"
          body: |
            A scheduled `fetch-sentiment` run failed, so `data/market/news/`
            holds no fresh digest for this session.

            This one is not just a data gap: the sentiment treatment is a
            **pre-registered A/B**, and the treatment agents read whatever is
            committed. A missing digest silently turns that session's treatment
            arm into a control arm, with nothing in the published record saying
            so.

            **Where to look**
            - The fetch step's log for a provider error or rate limit.
            - Whether the session that followed consumed a stale digest.
