name: fetch-sentiment

# Fetches news digests for active portfolio tickers and commits updates to
# data/market/news/. The sandboxed trading session reads from the committed
# repo (no network), so this workflow is what keeps sentiment data fresh.
#
# Schedule: Mon-Fri 09:00 UTC. It was 19:00 until 2026-08-07, then 18:00
# until 2026-08-12. The session runs at 20:00 UTC today and moves to
# 11:00 UTC in a later change.
#
# The collector must commit BEFORE the session reads the repo, and its
# digests must be dated the SAME DAY as the session: step_check_sentiment_
# freshness records `treatment` only when data/market/news/ holds a digest
# for the session date, and `degraded-to-control` otherwise. At 18:00 with
# an 11:00 session that check would have recorded a degraded arm every
# single day. 09:00 lands ~09:37-10:39 under the measured GitHub scheduler
# drift (37 min to 3 h), inside the same session day and ahead of 11:00.
#
# Timing is not the guarantee — the assertion is. Each session appends the
# arm it actually ran to data/market/sentiment_arm.jsonl, committed.
# Also exposes manual workflow_dispatch for ad-hoc refresh.

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Run date in YYYY-MM-DD format (default: today UTC)"
        required: false
        default: ""

permissions:
  contents: write  # needed to commit news digests back to main
  issues: write    # failure has to reach a human — see .github/actions/failure-issue

concurrency:
  group: fetch-sentiment
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch sentiment digests
        env:
          RUN_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          FLAGS=()
          if [[ -n "$RUN_DATE" ]]; then
            # Validate: only accept YYYY-MM-DD format
            if [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              FLAGS+=(--date "$RUN_DATE")
            else
              echo "Invalid date format '${RUN_DATE}', using today."
            fi
          fi
          python scripts/fetch_sentiment.py "${FLAGS[@]}"

      - name: Resolve commit date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        uses: ./.github/actions/push-with-retry
        with:
          paths: data/market/news/
          message: "[data] ${{ steps.today.outputs.date }} sentiment digests"

      - name: Report outcome
        if: always()
        uses: ./.github/actions/failure-issue
        with:
          outcome: ${{ job.status }}
          title: "fetch-sentiment: news digests were not refreshed"
          body: |
            A scheduled `fetch-sentiment` run failed, so `data/market/news/`
            holds no fresh digest for this session.

            This one is not just a data gap: the sentiment treatment is a
            **pre-registered A/B**, and the treatment agents read whatever is
            committed. A missing digest silently turns that session's treatment
            arm into a control arm, with nothing in the published record saying
            so.

            **Where to look**
            - The fetch step's log for a provider error or rate limit.
            - Whether the session that followed consumed a stale digest.
