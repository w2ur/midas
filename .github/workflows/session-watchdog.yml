name: session-watchdog

# Weekday-only check (Tue-Sat 02:00 UTC): did yesterday's weekday session
# commit land on main? Catches the 2026-05-08-class bugs where a sandbox push
# 403'd and the work never made it to main despite the orchestrator
# "succeeding".
#
# Why weekday-only: weekends run a valuation-only refresh-leaderboard job, not
# an agent session. That job commits nothing when the valuation produces no
# diff (e.g. a quiet weekend, or fresh data already on main) — a legitimate
# no-commit outcome the watchdog cannot distinguish from a silent failure.
# Watching weekends therefore produced recurring false alarms (2026-06-14), so
# the weekend branch was removed. The weekday session always commits.
#
# Cron 2-6 = Tue-Sat, so "yesterday" is always Mon-Fri. A defensive guard still
# skips if "yesterday" lands on a weekend (e.g. a manual workflow_dispatch).
#
# The `close-runs` job beside it checks an EFFECT, not a config: the two
# same-evening close runs (eu 19:15, us 21:20 UTC) are fired by a Cloudflare
# Worker whose deployed schedule cannot be read from CI without a Cloudflare
# secret. From 2026-09-28 the deployed Worker held the pre-move crypto cron and
# neither close cron, so no close run ever fired by itself, and nothing noticed
# for five days because the repo's own config (wrangler.toml) was correct. A
# close run that fires lands a `[data] ... OHLCV update (eu close)` / `(us
# close)` commit on main; none at all after 19:00 UTC means the Worker is not
# firing them.

on:
  schedule:
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

# Alerting: a red X plus a workflow-failure email is not a closed loop. On
# 2026-08-01 this job correctly caught the missing 07-31 session and the alert
# went unconsumed for a day — the miss was found by hand, not by the watchdog
# that had already flagged it. A failed run scrolls out of the Actions tab and
# the email lands in the same inbox flood as every other notification, so on a
# miss the job now files a GitHub issue: it persists, it is visible on the repo
# without going looking, and it stays open until a human resolves it.

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Check yesterday's weekday session commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)
          dow=$(date -u -d 'yesterday' +%u)  # 1=Mon..7=Sun

          if [[ "$dow" -lt 1 || "$dow" -gt 5 ]]; then
            echo "Yesterday ($yesterday) was a weekend — no weekday session expected. Skipping."
            exit 0
          fi

          pattern="^chore: weekday session $yesterday"
          title="Missing weekday session $yesterday"

          # An issue for this date may already be open from an earlier run of
          # this same job (a manual workflow_dispatch, or a re-run).
          #
          # Deliberately non-fatal: under `set -euo pipefail` a transient gh
          # failure (rate limit, API blip) would otherwise abort the job before
          # it ever checked main, producing a red run with no ::error:: and no
          # issue — silence dressed up as an alert, the exact failure being
          # fixed here. On a lookup failure we treat it as "none open" and file;
          # a duplicate issue is a far cheaper mistake than a missed session.
          #
          # AND author-scoped, since 2026-08-19: this repository is public, so
          # anyone can open an issue with any title. This lookup feeds `gh issue
          # close`, so an unscoped match would let a stranger's issue be closed by
          # the bot and a real miss go unreported.
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
                       --json number,title,author \
                       --jq ".[] | select(.title == \"$title\")
                                | select(.author.login == \"app/github-actions\")
                                | .number" \
                     2>/dev/null | head -n1) || existing=""

          echo "Looking for weekday session commit for $yesterday..."

          # Materialise the subjects to a file, then grep the file. NOT
          # `git log ... | grep -Eq`: `grep -q` exits the instant it matches,
          # closing the pipe. If `git log` is still walking history at that
          # moment its next write hits the closed pipe and it dies of SIGPIPE
          # (141); under `set -o pipefail` that becomes the pipeline's status,
          # so the `if` reads FALSE and a commit that IS there is reported
          # missing.
          #
          # It is a race on "has git log finished walking yet", which is why
          # this misfired intermittently rather than daily: the checkout above
          # is `fetch-depth: 50`, so the walk is short and usually wins.
          # Measured under bash against this repo's full history (2026-08-04,
          # one matching subject provably present), the piped form reported
          # missing in 20 of 20 runs; against a 3-commit fixture it reported
          # correctly every time. tests/test_ci_guards.py pins both the shape
          # and the behaviour, on a fixture sized to lose the race.
          subjects_file="${RUNNER_TEMP:-/tmp}/session-subjects.txt"
          git log origin/main --since="$yesterday 00:00 UTC" --until="$yesterday 23:59 UTC" --pretty=%s > "$subjects_file"
          if grep -Eq "$pattern" "$subjects_file"; then
            echo "Found expected weekday session commit for $yesterday."
            # The session landed after a previous run flagged it (a backfill, or
            # a late auto-merge). Retract the alert rather than leaving a
            # resolved issue open to rot — an issue tracker nobody trusts to be
            # current is the same dead end as an unread email.
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" \
                --comment "Session commit for $yesterday is now on main. Closed automatically by [session-watchdog]($RUN_URL)."
              echo "Closed stale issue #$existing."
            fi
            exit 0
          fi

          if [[ -n "$existing" ]]; then
            echo "Issue #$existing already open for $yesterday — not filing a duplicate."
          else
            # Body via --body-file, not --body "$(cat <<EOF ...)". Bash cannot
            # parse an unbalanced apostrophe inside a heredoc nested in a
            # command substitution inside double quotes — "403'd" below is
            # enough to make the whole script a syntax error. A top-level
            # heredoc into a file has no such limitation.
            #
            # The heredoc body sits at the block scalar's base indentation on
            # purpose: YAML strips exactly that much, so the shell sees EOF at
            # column 0. Dedenting it here to column 0 instead terminates the
            # `run: |` block and the workflow stops parsing as YAML.
            body_file="${RUNNER_TEMP:-/tmp}/watchdog-issue.md"
          cat > "$body_file" <<EOF
          The \`session-watchdog\` job found no \`chore: weekday session $yesterday\`
          commit on \`main\`.

          The weekday session fires at 22:00 UTC Mon-Fri and always commits. Its
          absence means the run never happened, aborted, or never reached \`main\`.

          **Where to look**
          - Weekday session RemoteTrigger run for $yesterday.
          - \`session_guard\` abort (stalled sandbox, date rollover, ledger moved
            on main) — the guard is designed to abandon the run, so an abort here
            is the system working. The next scheduled session starts clean; do
            **not** reconcile by hand.
          - A sandbox push that 403'd, leaving the work on a \`claude/**\` branch
            that \`auto-merge-session\` never landed.
          - The account's five-hour rate limit: the run log shows
            \`rate_limit: rejected\` and the run ends after one turn, before
            Step 0. The desk shares the subscription limit with interactive
            work (2026-09-09, #68). Nothing to repair; record the lost day in
            the METHODOLOGY changelog (\`#missing-session-2026-09-09\`).

          Detected by [this run]($RUN_URL).
          EOF
            url=$(gh issue create --title "$title" --body-file "$body_file" | tail -n1)
            echo "Filed $url"
          fi

          echo "::error::No weekday session commit for $yesterday on main. Daily pipeline likely failed silently."
          exit 1

  close-runs:
    # Independent of `watchdog`: a missing session says nothing about the
    # Worker, and a missing close run must not wait for the session check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Check yesterday's same-evening close-run commits on main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)
          dow=$(date -u -d 'yesterday' +%u)  # 1=Mon..7=Sun

          if [[ "$dow" -lt 1 || "$dow" -gt 5 ]]; then
            echo "Yesterday ($yesterday) was a weekend — no close runs expected. Skipping."
            exit 0
          fi

          title="Missing close-run commits $yesterday"
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
                       --json number,title,author \
                       --jq ".[] | select(.title == \"$title\")
                                | select(.author.login == \"app/github-actions\")
                                | .number" \
                     2>/dev/null | head -n1) || existing=""

          # BEGIN close-run detection
          # Materialise to a file and grep the file (never `git log | grep -q`:
          # the SIGPIPE race the session check's comment describes).
          # The window opens at 19:00 UTC and has no upper edge on purpose: a
          # close run the scheduler starts late can land its commit after
          # midnight, and its subject carries the date it RAN, not the day it
          # priced.
          close_file="${RUNNER_TEMP:-/tmp}/close-run-subjects.txt"
          git log origin/main --since="$yesterday 19:00 UTC" --pretty=%s > "$close_file"
          eu=0; us=0
          if grep -Eq '^\[data\] [0-9-]+ OHLCV update \(eu close\)' "$close_file"; then eu=1; fi
          if grep -Eq '^\[data\] [0-9-]+ OHLCV update \(us close\)' "$close_file"; then us=1; fi
          # END close-run detection

          echo "close-run commits since $yesterday 19:00 UTC: eu=$eu us=$us"

          if [[ "$eu" -eq 1 && "$us" -eq 1 ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" \
                --comment "Both close-run commits for $yesterday are on main. Closed automatically by [session-watchdog]($RUN_URL)."
            fi
            exit 0
          fi

          if [[ "$eu" -eq 0 && "$us" -eq 0 ]]; then
            if [[ -z "$existing" ]]; then
              body_file="${RUNNER_TEMP:-/tmp}/close-run-issue.md"
          cat > "$body_file" <<EOF
          The \`session-watchdog\` job found no \`(eu close)\` and no \`(us close)\`
          OHLCV commit on \`main\` after 19:00 UTC on $yesterday.

          Both are fired by the \`workers/trigger-gate/\` Cloudflare Worker
          (\`15 19 * * 1-5\` and \`20 21 * * 1-5\`), never by a GitHub cron, so
          this means the Worker is not firing them. CI cannot read the deployed
          schedule, so this checks the effect.

          **Where to look**
          - The Worker's registered crons (Cloudflare dashboard or API) against
            \`workers/trigger-gate/wrangler.toml\`. Deploy from an up-to-date
            \`main\`: on 2026-09-28..10-03 the deployed copy held a stale cron
            list and \`wrangler.toml\` was correct.
          - The \`fetch-ohlcv\` run list for \`workflow_dispatch\` events near
            19:15 and 21:20 UTC.
          - A day on which both the US and Europe were closed (a holiday)
            commits nothing and trips this check; if so, close this issue.

          Detected by [this run]($RUN_URL).
          EOF
              url=$(gh issue create --title "$title" --body-file "$body_file" | tail -n1)
              echo "Filed $url"
            else
              echo "Issue #$existing already open for $yesterday — not filing a duplicate."
            fi
            echo "::error::No close-run commit (eu or us) for $yesterday on main. The Worker is likely not firing them."
            exit 1
          fi

          # One of the two is present: a one-sided holiday (US-only or EU-only)
          # looks identical to one lost dispatch, so this warns and does not
          # fail.
          echo "::warning::Only one close-run commit for $yesterday on main (eu=$eu us=$us). A one-sided market holiday looks the same; check the fetch-ohlcv run list if it was not one."
