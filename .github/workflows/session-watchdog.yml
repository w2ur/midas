name: session-watchdog

# Daily 02:00 UTC check: did the expected session/refresh commit land on
# main yesterday? Catches the 2026-05-08-class bugs where a sandbox push
# 403'd and the work never made it to main despite the orchestrator
# "succeeding".
#
# Logic:
#  - Yesterday was Mon-Fri → expect "chore: weekday session YYYY-MM-DD"
#  - Yesterday was Sat-Sun → expect "chore: weekend refresh YYYY-MM-DD"
# Failures alert via standard GitHub workflow-failure email.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check yesterday's commit on main
        run: |
          set -euo pipefail

          yesterday=$(date -u -d 'yesterday' +%Y-%m-%d)
          dow=$(date -u -d 'yesterday' +%u)  # 1=Mon..7=Sun

          if [[ "$dow" -ge 1 && "$dow" -le 5 ]]; then
            pattern="^chore: weekday session $yesterday"
            kind="weekday session"
          else
            pattern="^chore: weekend refresh $yesterday"
            kind="weekend refresh"
          fi

          echo "Looking for $kind commit for $yesterday..."
          if git log origin/main --since="$yesterday 00:00 UTC" --until="$yesterday 23:59 UTC" --pretty=%s | grep -Eq "$pattern"; then
            echo "Found expected $kind commit for $yesterday."
            exit 0
          fi

          echo "::error::No $kind commit for $yesterday on main. Daily pipeline likely failed silently."
          exit 1
