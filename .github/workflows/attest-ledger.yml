name: attest-ledger

# Daily ledger attestation via annotated git tags.
#
# Tamper-evidence mechanism
# --------------------------
# This workflow creates an annotated git tag on the current main HEAD whose
# message contains a deterministic SHA-256 digest of the committed trade
# ledger (data/orders/, data/portfolios/, data/leaderboard/current.json).
# The tag is then pushed to GitHub.
#
# Third-party attestation = GitHub's immutable push timestamp on the tag +
# the hash recorded in the retained Actions run log/summary.  A
# "you backdated your git history" accusation would require compromising:
#   1. GitHub's tag push event timeline (immutable after the fact), AND
#   2. The GitHub Actions run log (immutable after execution).
#
# Why NOT GPG signing?
# True GPG signing (git tag -s) is NOT available on stock GitHub-hosted
# runners — the runner has no private key material.  An annotated tag whose
# message carries the digest, pushed to GitHub, is the practical equivalent:
# the commitment is GitHub's server-side timestamp, not a cryptographic
# signature.
#
# Tag naming: attest/<YYYY-MM-DD>  (one per calendar day, UTC)
#
# Idempotency (re-run on the same day)
# We delete and recreate the tag if it already exists.  This is intentional:
# a re-run on the same day (e.g. after a manual trigger or a failed first
# attempt) should reflect the LATEST committed ledger state, not the stale
# one from the first run.  The force-push is safe because the tag namespace
# `attest/*` is exclusively owned by this workflow; no human workflow depends
# on tag immutability here (the run log itself is immutable and records both
# the old and new hash if a re-run happens).
#
# Schedule: 23:00 UTC — after the 20:00 UTC session and clear of the
# 19:55–20:30 watcher blackout.

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to push an annotated tag

concurrency:
  group: attest-ledger
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          # Full history is needed so `git tag` can operate on the correct commit.
          fetch-depth: 0
          # Blobs are fetched lazily. Full history and all tags are still here —
          # which is what the HEAD-date label, the previous-tag lookup and
          # --verify's detached-worktree re-derivation actually need. The
          # fetch-depth:0 checkout measured 143s of a 208s job on 2026-08-18.
          #
          # This is a MEASURED BET, kept in its own commit so it can be reverted
          # alone: --verify walks a tag's whole tree, and those lazy blob fetches
          # could cost more than the checkout saves. Keep only if the WHOLE job
          # got faster — compare `Checkout repo` AND `Verify the previous
          # attestation` against the 143s/3s baseline above.
          filter: blob:none
          token: ${{ secrets.GITHUB_TOKEN }}

      # No dependency install, deliberately: scripts/attest_ledger.py imports
      # stdlib only, and the workflow's other tool (jq) is preinstalled on the
      # runner image. Installing the 120-package lockfile cost 46s a night to
      # import nothing from it. Verified 2026-08-18 by running all three
      # invocations used below (--verify, --json, --render-from) against an
      # interpreter with an empty site-packages. `cache: "pip"` goes with it —
      # there is no install left to cache. setup-python stays: pinning 3.12
      # rather than floating with the runner image is free.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs BEFORE today's tag is written, so it checks the previous
      # attestation against the history that now sits underneath it.
      #
      # Until this step existed the workflow computed a digest and asserted
      # nothing about it: a tampered ledger produced a different hash and a
      # green run, so 55 consecutive green runs were evidence only that the
      # workflow had executed. Re-deriving a published tag's digest from that
      # tag's own tree is the assertion — the one thing the digest was for.
      - name: Verify the previous attestation still re-derives
        run: python scripts/attest_ledger.py --verify

      - name: Compute ledger digest
        id: digest
        run: |
          # Compute the digest exactly ONCE and save it to digest.json.
          # All downstream steps (summary, tag message, tag name) read from
          # this single file so that date, content, and tag name can never
          # disagree across a midnight boundary.
          #
          # The label comes from the HEAD commit's UTC date, not from the
          # clock (2026-08-07 review, W2.7). This job is scheduled 23:00 UTC
          # and GitHub's scheduler is never on time: measured over the eight
          # most recent tags it actually fired at 00:01-01:44, i.e. ALWAYS
          # past midnight, so `attest/2026-08-06` was created at 00:03 on
          # 08-06 attesting a ledger whose newest commit was 08-05 23:42.
          # Seven of eight sampled tags were labelled a day ahead of the
          # ledger they attest.
          #
          # "Yesterday UTC" would fix the measured pattern and break the
          # first run that lands at 23:5x. The HEAD commit's date is a
          # property of the thing being attested rather than of when the
          # runner woke up, so it is right on either side of midnight. A day
          # in which nothing was committed re-cuts the same tag, which the
          # idempotent delete-and-recreate below already handles — and which
          # is the honest answer: the ledger did not move.
          LEDGER_DATE=$(TZ=UTC git log -1 --date=format:%F --format=%ad)
          echo "Attesting the ledger as of its newest commit: ${LEDGER_DATE}"
          python scripts/attest_ledger.py --json --date "$LEDGER_DATE" > digest.json

          # Extract fields for use in later steps.
          TAG_DATE=$(jq -r '.generated_for_date' digest.json)
          DIGEST_ROOT=$(jq -r '.digest_root' digest.json)
          echo "date=$TAG_DATE" >> "$GITHUB_OUTPUT"
          echo "digest_root=$DIGEST_ROOT" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        run: |
          echo "## Midas Ledger Attestation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python scripts/attest_ledger.py --render-from digest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push annotated tag
        env:
          TAG_DATE: ${{ steps.digest.outputs.date }}
        run: |
          TAG_NAME="attest/${TAG_DATE}"

          # Delete the tag locally and remotely if it already exists (idempotent
          # re-run: recreate with the latest ledger state rather than keeping a
          # stale first-run tag).  Suppress errors if the tag does not exist.
          git tag -d "$TAG_NAME" 2>/dev/null || true
          git push origin ":refs/tags/${TAG_NAME}" 2>/dev/null || true

          # Render the attestation block from the saved digest (same object used
          # for the step summary — no recomputation, no midnight-boundary skew).
          # Pass the message via a file to avoid shell quoting issues.
          TMPFILE=$(mktemp)
          python scripts/attest_ledger.py --render-from digest.json > "$TMPFILE"
          git tag -a "$TAG_NAME" -F "$TMPFILE"
          rm -f "$TMPFILE"

          # Push the tag to GitHub — this is the immutable timestamped record.
          git push origin "refs/tags/${TAG_NAME}"

          echo "Pushed tag: ${TAG_NAME}"
          echo "Digest root: ${{ steps.digest.outputs.digest_root }}"
