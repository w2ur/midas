name: Push with rebase retry
description: >
  Commit staged changes and push to main, rebasing and retrying when another
  scheduled writer got there first.

# Why this exists: four scheduled workflows pushed to main with a bare
# `git push` and no retry — fetch-ohlcv, fetch-sentiment, refresh-universes and
# resweep-held-tickers. GitHub's scheduler is never on time: measured across
# this repo's run history it typically lands 40 min to 2 h 45 late, with a tail
# past 5 h (the worst observed was a fetch-sentiment run ~5 h 43 late on
# 2026-08-07). So their nominal
# separation guarantees nothing about the order they actually land in. When two
# collide, the loser's push is rejected, the step fails, and its commit dies
# with the runner.
#
# The worst case is `resweep-held-tickers`: its commit can carry a
# corporate-action adjustment applied to real holdings by
# `PortfolioManager.apply_split`. A lost push there silently discards a share
# and cost-basis correction for a week, until the next Monday's run.
#
# `scripts/refresh_leaderboard._push_with_rebase_retry` and
# `scripts/check_triggers` already did this in Python. This is the same
# contract for the workflows that only ever touch git from shell.
#
# Rebase, not merge: these are data commits on top of main, and a merge commit
# per collision would litter the history that `git log --grep='[restate]'` and
# the session-integrity guard read.

inputs:
  paths:
    description: "Paths to `git add`. Nothing is committed if these are clean."
    required: true
  message:
    description: "Commit message."
    required: true
  attempts:
    description: "Total push attempts, including the first."
    required: false
    default: "3"

outputs:
  pushed:
    description: '"true" when a commit was created and pushed, "false" when there was nothing to commit.'
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        set -euo pipefail

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Drop pathspecs that match nothing before staging. `git status` and
        # `git add` disagree about an absent path: status exits 0 and reports
        # nothing for it, add exits 128 with "pathspec ... did not match any
        # files". So the guard below passed and the stage died, under `set -e`,
        # taking the whole run with it — that is how `fetch-ohlcv` lost the
        # 2026-08-08 and 08-09 stores after both had fetched cleanly. It passes
        # `data/market/quarantine/`, which exists only once the ingest tripwire
        # has actually refused a row, i.e. never on a healthy night.
        #
        # The condition mirrors exactly when `git add` succeeds: a worktree
        # entry, OR a tracked path that has been deleted (so staging a deletion
        # still works — filtering on `-e` alone would silently skip it).
        present=()
        for path in $INPUT_PATHS; do
          if [[ -e "$path" ]] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
            present+=("$path")
          else
            echo "Skipping '$path' — it matches nothing in the worktree or the index."
          fi
        done

        if [[ ${#present[@]} -eq 0 ]]; then
          echo "None of the requested paths exist: $INPUT_PATHS"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -z "$(git status --porcelain -- "${present[@]}")" ]]; then
          echo "Nothing to commit under: ${present[*]}"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git add -- "${present[@]}"
        git commit -m "$INPUT_MESSAGE"

        for attempt in $(seq 1 "$INPUT_ATTEMPTS"); do
          if git push origin HEAD:main; then
            echo "Pushed on attempt ${attempt}."
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$attempt" -eq "$INPUT_ATTEMPTS" ]]; then
            break
          fi
          echo "Push rejected (attempt ${attempt}/${INPUT_ATTEMPTS}) — another writer landed first; rebasing."

          # A shallow checkout cannot rebase onto a fetched main, so it has to
          # be deepened — but only HERE, on the path that actually needs it.
          # Deepening cost ~110-127s and ~836 MB on this repo (measured
          # 2026-08-18) and used to run unconditionally, before the first push
          # attempt, on every committing run of all four scheduled writers. The
          # first push succeeds on nearly all of them, so that was ~110 billed
          # minutes a month spent preparing for a path almost never taken.
          #
          # Ask before deepening: `--unshallow` is a hard error on a complete
          # clone, and a caller may legitimately check out at full depth.
          # Nothing in this branch may die under `set -euo pipefail`, or the
          # step ends right here — skipping the remaining attempts AND the
          # explicit "this commit is lost with the runner" error below, so a
          # lost commit gets reported as a generic step failure instead.
          #
          # The fetch fallback alone was NOT enough for that, which is the
          # trap: if `--unshallow` fails transiently, the fallback fetch
          # succeeds SHALLOWLY, and the rebase on a still-shallow clone is then
          # what `set -e` kills. So the rebase is guarded too, and a failed one
          # is aborted and retried rather than being fatal — matching what
          # scripts/check_triggers._git_add_commit already does.
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --unshallow origin main || git fetch origin main || true
          else
            git fetch origin main || true
          fi
          if ! git pull --rebase origin main; then
            echo "Rebase failed on attempt ${attempt}; aborting it and retrying."
            git rebase --abort 2>/dev/null || true
            continue
          fi
        done

        echo "::error::Push to main failed after ${INPUT_ATTEMPTS} attempts. This commit is lost with the runner." >&2
        exit 1
