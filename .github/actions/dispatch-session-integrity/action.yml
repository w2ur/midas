name: Dispatch session-integrity
description: >
  Run by every workflow that pushes to main with GITHUB_TOKEN, after its
  push: dispatch session-integrity.yml on the commit this run landed, and
  file an issue if that dispatch cannot be made.

# Why this exists: GitHub starts no `on: push` run for a push made with
# GITHUB_TOKEN, and every scheduled writer of main pushes with it. So until
# 2026-09-25 session-integrity (ledger-integrity, cash-replay, append-only,
# the session/refresh artifact check, concerns) had never run on a single
# bot-pushed commit: not the fallback session merges (982dc191c, b63617d8b,
# 0cd1d815c — J6 money review round 2, N2) and not one weekend refresh
# (4becbbe5d, 58763ae00, 013ecead7, ace2b71ea, d799598f4, f7e96fc70 — round
# 3, I-1; 4becbbe5d rewrote every baseline file). workflow_dispatch is exempt
# from that rule, so the writer dispatches it with the sha it pushed.
#
# The commit under test is the one the run SAYS it landed: every push path
# writes the sha main took to `$RUNNER_TEMP/landed-on-main.sha` right after
# `git push … HEAD:main` succeeds (push-with-retry in shell,
# scripts/landed_on_main.py for check_triggers and refresh_leaderboard). No
# record, no dispatch: a run that committed nothing, or whose every commit
# went to a `triggers/*` fallback branch (auto-merge-session dispatches when
# it merges that), or whose push was refused. This used to be INFERRED — "the
# newest commit on main ahead of `before`" — and that is wrong after a rebase
# (money review round 5, M-a): a refused push, `pull --rebase` onto another
# writer's commit M', a refused retry, and HEAD's parent M' was dispatched as
# if this run had landed it. A multi-commit run (a watcher with several fires)
# records, and dispatches, its last landed commit: the ledger checks read
# state, so they cover the rest; append-only's HEAD^..HEAD window covers the
# last only, and the watcher writes no append-only path.
#
# `before` is the sha HEAD held just before the writing step, recorded by a
# step that is `if: always()` like this one: a writer that went red after its
# fetch still pushes, and a skipped record step lost that commit (round 4,
# I-A). It is now a cross-check: a recorded sha must be on main and a
# descendant of `before`, or the record contradicts the run and is reported.
#
# A dispatch that cannot be made — or a main that cannot be read — files an
# issue under its own title and then fails the step. Put this step AFTER the
# workflow's own `Report outcome`: the writer's issue then describes the
# writer's own outcome truthfully, and this one describes the missing check.
# The issue names the commit left unchecked, and only a successful dispatch
# of THAT commit closes it; a later run landing another commit does not.

inputs:
  before:
    description: "HEAD's sha immediately before this run wrote anything (writers that commit)."
    required: false
    default: ""
  sha:
    description: >
      The exact commit this run landed on main, when the caller knows it —
      auto-merge-session, whose merge may fast-forward (HEAD then equals the
      branch tip, so a `before` comparison sees no movement) or fail after
      checking out main (HEAD is then a tip it never pushed). Takes precedence
      over `before`.
    required: false
    default: ""
  token:
    description: "Token with actions: write and issues: write on this repository."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - id: dispatch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BEFORE: ${{ inputs.before }}
        SHA: ${{ inputs.sha }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        dispatch() {
          local sha=$1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "subject=$sha" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if gh workflow run session-integrity.yml --repo "$REPO" --ref main -f sha="$sha"; then
              echo "Dispatched session-integrity for $sha."
              echo "result=dispatched" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not dispatch session-integrity for $sha after 3 attempts."
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 0
        }
        # Explicit mode (round 4, M-1): the caller names the commit it landed.
        if [[ -n "$SHA" ]]; then
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]] || ! git fetch -q --depth=50 origin main \
             || ! git merge-base --is-ancestor "$SHA" FETCH_HEAD; then
            echo "::error::'$SHA' was reported as landed but is not a commit on main."
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "subject=$SHA" >> "$GITHUB_OUTPUT"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dispatch "$SHA"
        fi
        head=$(git rev-parse HEAD)
        if [[ ! "$BEFORE" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::dispatch-session-integrity: 'before' is not a sha ('$BEFORE') — cannot tell whether this run landed a commit."
          # No commit to name: a subject unique to this run, so no other
          # run's success can close the issue (follow-up review r3, M1).
          echo "subject=an unknown commit (run ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1})" >> "$GITHUB_OUTPUT"
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$head" == "$BEFORE" ]]; then
          echo "This run landed no commit on main — nothing to dispatch."
          echo "result=none" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # What this run's push paths recorded as landed (money review round
        # 5, M-a). The last fill before a watcher fell back to a `triggers/*`
        # branch is recorded too (round 4, M-2), so it is still checked.
        record="$RUNNER_TEMP/landed-on-main.sha"
        landed=$(tail -n 1 "$record" 2>/dev/null | tr -d '[:space:]' || true)
        if [[ -z "$landed" ]]; then
          echo "HEAD moved to $head but no push of this run reached main (nothing recorded in $record: a fallback branch, or a push that was refused) — nothing to dispatch; whatever merges it dispatches then."
          echo "result=none" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "sha=$landed" >> "$GITHUB_OUTPUT"
        echo "subject=$landed" >> "$GITHUB_OUTPUT"
        if [[ ! "$landed" =~ ^[0-9a-f]{40}$ ]] || ! git fetch -q --depth=50 origin main \
           || ! git merge-base --is-ancestor "$landed" FETCH_HEAD \
           || [[ "$landed" == "$BEFORE" ]] \
           || ! git merge-base --is-ancestor "$BEFORE" "$landed"; then
          echo "::error::This run recorded '$landed' as landed, but it is not a commit on main that follows $BEFORE."
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dispatch "$landed"

    - name: Report the dispatch
      if: steps.dispatch.outputs.result != 'none'
      uses: ./.github/actions/failure-issue
      with:
        token: ${{ inputs.token }}
        outcome: ${{ steps.dispatch.outputs.result == 'dispatched' && 'success' || 'failure' }}
        # Keyed to the commit (follow-up review r3, M1): titled per workflow,
        # the next run that dispatched ANY commit closed this issue as
        # recovered while the commit it names was never checked. Only a
        # successful dispatch of that same commit closes it now.
        title: "session-integrity was not dispatched on ${{ steps.dispatch.outputs.subject }} after ${{ github.workflow }}"
        body: |
          `${{ github.workflow }}` pushed a commit to `main` with GITHUB_TOKEN,
          which starts no `on: push` run, and then could not dispatch
          `session-integrity.yml` on it. That commit is on `main` UNCHECKED:
          ledger-integrity, cash-replay, append-only, the session/refresh
          artifact check and the concerns filing have not run on it.

          Nothing in the writer's own work failed — its own outcome is
          reported separately. Run the check by hand on the sha below:

              gh workflow run session-integrity.yml --ref main -f sha=<sha>

          then close this issue. A later run of this workflow does NOT close
          it: it names this commit, and a later commit passing says nothing
          about this one.
        details: "Commit left unchecked: `${{ steps.dispatch.outputs.sha }}`"

    - name: Fail when the check was not dispatched
      if: steps.dispatch.outputs.result == 'failed'
      shell: bash
      run: |
        echo "::error::session-integrity was not dispatched on ${{ steps.dispatch.outputs.sha }} — see the issue this step filed."
        exit 1
