# Cloud Build pipeline for the Midas backtester service.
#
# Builds backtester/Dockerfile from the repo root (so the Dockerfile's
# COPY engine /app/engine, COPY data/market/ohlcv /app/data/market/ohlcv, etc.
# resolve correctly), pushes to Artifact Registry, and deploys to Cloud Run.
#
# Run from the repo root:
#   gcloud builds submit --config cloudbuild.yaml
#
# ---------------------------------------------------------------------------
# THE REGISTRY IS IN THE SAME REGION AS THE SERVICE, AND THAT IS THE POINT.
#
# This pipeline used to push to `gcr.io/$PROJECT_ID/...`. `gcloud artifacts
# repositories list` shows what that actually resolved to after Google's
# auto-migration:
#
#   REPOSITORY  FORMAT  LOCATION  SIZE (MB)
#   gcr.io      DOCKER  us        2773.910
#
# The Cloud Run service runs in europe-west1. So every cold start was pulling a
# ~456 MB image out of a US-hosted registry into a Belgian data centre, and no
# amount of shaving the image was ever going to fix the transatlantic hop. A
# same-region Artifact Registry repository removes it.
#
# ONE-TIME PREREQUISITE — this file will fail at the push step until it exists:
#
#   gcloud artifacts repositories create ${_REPO} \
#     --repository-format=docker --location=${_REGION} \
#     --description="Midas backtester runtime images"
#
# The old us-located `gcr.io` repository can be deleted afterwards (it is 2.7 GB
# of superseded revisions), but do that only once a europe-west1 revision is
# serving — Cloud Run needs the image its current revision points at.
# ---------------------------------------------------------------------------

substitutions:
  _SERVICE: midas-backtester
  _REGION: europe-west1
  _REPO: backtester

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - -f
      - backtester/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --update-secrets=BACKTESTER_SECRET=backtester-secret:latest
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=4
      - --min-instances=0
      - --max-instances=3

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
