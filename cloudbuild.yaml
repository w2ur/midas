# Cloud Build pipeline for the Midas backtester service.
#
# Builds backtester/Dockerfile from the repo root (so the Dockerfile's
# COPY engine /app/engine, COPY data/market /app/data/market, etc.
# resolve correctly), pushes to Container Registry, and deploys to
# Cloud Run.
#
# Run from the repo root:
#   gcloud builds submit --config cloudbuild.yaml

substitutions:
  _SERVICE: midas-backtester
  _REGION: europe-west1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:latest
      - -f
      - backtester/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_SERVICE}

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=4
      - --min-instances=0
      - --max-instances=5

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
